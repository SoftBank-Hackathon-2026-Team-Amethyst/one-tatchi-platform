{{- if .Values.receiver.enabled }}
{{- $_ := required "receiver.secretName is required" .Values.receiver.secretName }}
{{- $_ = required "receiver.host is required" .Values.receiver.host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-receiver
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 128; }
    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        location = /health { access_log off; return 200; }
        location = /api/v1/write {
          limit_except POST { deny all; }
          auth_basic "metrics ingest";
          auth_basic_user_file /etc/auth/htpasswd;
          client_max_body_size 2m;
          proxy_pass http://{{ .Release.Name }}:9090;
          proxy_set_header Authorization "";
        }
        location / { return 404; }
      }
    }
{{- end }}
