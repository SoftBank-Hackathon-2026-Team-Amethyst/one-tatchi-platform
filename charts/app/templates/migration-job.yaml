{{- if .Values.migration.enabled }}
{{- $name := include "app.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  migration.sql: |
    {{- required "migration.sql is required" .Values.migration.sql | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.migration.image }}
          command: ["sh", "-c", "psql \"$DB_URL\" -v ON_ERROR_STOP=1 -f /migration/migration.sql"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "migration.secretName is required" .Values.migration.secretName }}
                  key: {{ .Values.migration.urlKey }}
          securityContext:
            {{- include "app.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: sql
              mountPath: /migration
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql
          configMap:
            name: {{ $name }}-migration
        - name: tmp
          emptyDir: {}
{{- end }}
