{{- if .Values.ingress.enabled }}
{{- $name := include "app.name" . -}}
{{/* Green is reachable only through the internal preview Service. */}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  {{- with include "app.ingressAnnotations" (dict "root" $ "host" $.Values.ingress.host "healthcheckPath" $.Values.ingress.healthcheckPath) | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  rules:
    {{- if $.Values.ingress.host }}
    - host: {{ $.Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- range $.Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          {{- end }}
{{- end }}
