# 서비스는 이 파일의 값만 덮어쓴다. 템플릿은 고치지 않는다.

image:
  repository: ""
  tag: ""
  digest: "" # 새 배포는 검사한 멀티 아키텍처 index digest로 고정

replicas: 2
containerPort: 8000

# Enable per service so only workloads with measured capacity needs autoscale.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

# 릴리스 전략 인터페이스: blueGreen | rolling (canary는 아직 미구현)
deployStrategy: blueGreen

blueGreen:
  # false면 green이 뜬 뒤 Promote를 기다린다. true면 준비되는 즉시 넘어간다.
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30

env: {}
# 환경변수로 통째로 주입할 Secret 이름 (예: Terraform이 만든 <서비스>-db)
envFromSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

probe:
  path: /health
  initialDelaySeconds: 5

# readOnlyRootFilesystem이라 쓰기가 필요한 경로는 emptyDir로 마운트한다.
writablePaths:
  - /tmp

service:
  port: 80
  annotations: {}

# Optional internal-only HTTP metrics. The collector discovers pods, never Ingress.
metrics:
  enabled: false
  gcpManaged: false
  port: 8000
  path: /metrics
  nginxLogExporter:
    enabled: false
    image: "" # 기본값: 플랫폼과 같은 버전의 GHCR nginxlog-exporter

ingress:
  enabled: false
  className: alb
  annotations: {}
  # 같은 group끼리 ALB 하나를 공유한다 (platform 스택 출력값 ingress_group)
  group: ""
  # 숫자가 작을수록 먼저 매칭된다. 좁은 경로일수록 작게.
  order: 100
  paths:
    - /
  healthcheckPath: /health
  # 접속 호스트 (예: 운영 onetatchi.soulee.dev, 테스트 yolo.onetatchi.soulee.dev).
  # 넣으면 HTTPS(443)로 열고 HTTP(80)는 443으로 리다이렉트한다. 인증서는 LB Controller가 host로 ACM에서 찾는다.
  # 비우면 host 없이 HTTP(80)만 연다 (도메인이 없는 환경).
  host: ""
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  # Green has no public Ingress. Legacy previewPort values are ignored.

# 승인자용 green 미리보기 (ADR 0015). 꺼져 있으면 green은 내부 preview Service로만 열린다.
# 켜면 oauth2-proxy가 OIDC 로그인을 강제하고, 인증된 요청만 <release>-preview로 넘긴다.
# blueGreen과 ingress.enabled가 필요하다. 인증 설정 없이 green을 여는 경로는 만들지 않는다.
previewAuth:
  enabled: false
  # green 접속 호스트 (예: green.onetachi.soulee.dev). HTTPS 인증서가 이 이름을 포함해야 한다.
  host: ""
  # OIDC issuer (예: Cognito https://cognito-idp.<region>.amazonaws.com/<user pool id>)
  issuerUrl: ""
  # 클라우드 시크릿(JSON) ID. 키: OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
  # ClusterSecretStore(secretStore)를 거쳐 <release>-preview-auth Secret으로 만든다.
  remoteKey: ""
  secretStore: cloud-secrets
  # 경로별로 다른 green Service로 보낸다. 나머지 경로는 이 릴리스의 preview로 간다.
  # 예: FE가 /api/를 BE로 프록시하면, green 화면이 green BE를 부르도록
  #   - path: /api/
  #     service: demo-app-be-preview
  #     port: 8000
  # 경로는 접두사로 매칭하고 그대로 넘긴다. 같은 네임스페이스의 Service만 가리킨다.
  routes: []
  # 로그인 허용 범위는 IdP 할당(Identity Center 앱 할당)으로 정한다. 이메일 도메인은 추가 제한이다.
  emailDomains:
    - "*"
  # IdP가 email_verified를 주지 않는 페더레이션(Identity Center → Cognito)이면 true로 둔다.
  allowUnverifiedEmail: true
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

migration:
  enabled: false
  image: postgres:17
  # 접속 문자열이 든 Secret과 키 (psql 형식)
  secretName: ""
  urlKey: PG_URL
  # --set-file migration.sql=<경로> 로 넣는다. 여러 번 실행해도 안전해야 한다.
  sql: ""
