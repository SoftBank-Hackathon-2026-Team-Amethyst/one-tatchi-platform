{{- with .Values.database }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore }}
  target:
    name: {{ .secretName }}
    template:
      engineVersion: v2
      data:
        # 세 키 모두 sslmode=require다. 클라우드 DB(RDS · Cloud SQL)는 TLS 없는 접속을 거부하고 온프레미스 Postgres도 TLS를 켜 둔다 (T28, ADR 0016).
        # DATABASE_URL: 표준 libpq URL. Node(postgres.js) · Python(psycopg) · psql이 그대로 읽는다.
        # SQLALCHEMY_URL: SQLAlchemy 전용 (드라이버 접두 +psycopg). DATABASE_URL과 값만 다르다.
        # PG_URL: DATABASE_URL과 같다. 마이그레이션 Job(psql)이 쓰던 이름이라 유지한다.
        DATABASE_URL: {{ printf "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" .host .port .name | quote }}
        SQLALCHEMY_URL: {{ printf "postgresql+psycopg://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" .host .port .name | quote }}
        PG_URL: {{ printf "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" .host .port .name | quote }}
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
