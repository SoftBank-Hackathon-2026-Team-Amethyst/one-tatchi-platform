{{- with .Values.database }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore }}
  target:
    name: {{ .secretName }}
    template:
      engineVersion: v2
      data:
        # SQLAlchemy용과 psql(마이그레이션)용 두 형식을 같이 만든다.
        DATABASE_URL: {{ printf "postgresql+psycopg://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s" .host .port .name | quote }}
        PG_URL: {{ printf "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=require" .host .port .name | quote }}
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
