name: chaos

# 재사용 워크플로: 장애 훈련 (T36, docs/chaos-drill.md).
# test의 green에 일부러 장애를 넣고, AI 승격 판단(promote-judge)이 기대한 결정(대부분 abort)을 내는지, blue(사용자 쪽)가 멀쩡한지
# 확인한 뒤 원래 상태로 돌려놓는다. 결과는 실행 요약 · Slack · 감사 로그에 남는다.
#   0. green 확인 → 1. green 준비(new-green) → 2. 장애 주입 → 3. promote-judge(manual) → 4. blue 확인 → 5. 정리(항상) → 6. 채점
# 대상 레포의 workflow_dispatch 워크플로(chaos.yml)가 호출하고, 그 워크플로는 slack-bot의 /chaos 명령 · 버튼이 실행한다 (T37).
# 안전장치: namespace는 test 고정(입력 없음), 장애는 green 파드에만, 정리는 if: always(), rollout.yml과 같은 concurrency group.
on:
  workflow_call:
    inputs:
      onprem-runner-label:
        type: string
        default: onprem
      target-label:
        type: string
        default: ""
      scenario:
        description: "시나리오 이름 (.github/actions/chaos-drill/scenarios.json): error-burst | slow-response | db-down | flaky"
        type: string
        required: true
      target:
        description: "배포 대상: aws | gcp | onprem"
        type: string
        default: aws
      cluster:
        description: "aws: EKS 클러스터 이름, onprem: runner의 kube context 이름"
        type: string
        required: true
      services:
        description: 함께 판단하는 서비스(Rollout) 이름들 (공백 구분, 예 "demo-app-be demo-app-fe"). test 배포의 묶음과 같아야 한다
        type: string
        required: true
      inject-services:
        description: 장애를 넣을 서비스들 (services의 부분집합, 공백 구분). /api/chaos가 있는 BE만. FE는 /api를 active BE로 프록시할 수 있어 넣지 않는다
        type: string
        required: true
      new-green:
        description: 대기 중인 green이 없을 때 훈련용 green을 띄울지. false면 green이 없으면 거절한다
        type: boolean
        default: false
      window-seconds:
        description: promote-judge 관찰 창(초)
        type: string
        default: "30"
      requested-by:
        description: 대신 실행을 요청한 주체 (slack-bot이 Slack 사용자를 넣는다)
        type: string
        default: ""
      template-ref:
        description: 공통 액션을 가져올 이 레포의 ref
        type: string
        default: v2
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  device:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: scripts/onprem
      - name: 대상 기기 확인
        env:
          TARGET: ${{ inputs.target }}
          TARGET_LABEL: ${{ inputs.target-label }}
          RUNNER_LABEL: ${{ inputs.onprem-runner-label }}
          CLUSTER: ${{ inputs.cluster }}
        run: python3 .platform/scripts/onprem/target.py

  drill:
    needs: device
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # onprem은 맥북의 self-hosted runner에서 돈다 (deploy.yml · rollout.yml과 같음)
    runs-on: ${{ inputs.target == 'onprem' && fromJSON(format('["self-hosted","{0}"]', inputs.onprem-runner-label)) || 'ubuntu-latest' }}
    timeout-minutes: 15
    # 훈련 중 승격 · 취소 버튼(rollout.yml)이 끼어들지 않게 같은 group을 쓴다. test 배포(deploy-… group)와의 겹침은 0단계의 Progressing 거절이 막는다
    concurrency:
      group: rollout-${{ inputs.target-label || inputs.target }}-${{ inputs.cluster }}-test
      cancel-in-progress: false
    env:
      # namespace는 test 고정. 입력으로 받지 않는다 (prod에 장애를 낼 경로를 만들지 않는다)
      NAMESPACE: test
      SCRIPTS: .platform/.github/actions/chaos-drill
      RELEASES: ${{ inputs.services }}
      INJECT_RELEASES: ${{ inputs.inject-services }}
      SCENARIO: ${{ inputs.scenario }}
      DRILL_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      LABEL: ${{ inputs.scenario }}@${{ inputs.target-label || inputs.target }}.test
    steps:
      # 대상 레포 (.deploy/smoke.json)
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - name: 입력 확인
        run: |
          echo "WORK_ROOT=$RUNNER_TEMP/chaos-drill" >> "$GITHUB_ENV"
          jq -e --arg s "$SCENARIO" '.scenarios[$s]' "$SCRIPTS/scenarios.json" >/dev/null \
            || { echo "::error::알 수 없는 시나리오: $SCENARIO (가능: $(jq -r '.scenarios | keys | join(", ")' "$SCRIPTS/scenarios.json"))"; exit 1; }
          [ -n "$(tr -d ' ' <<<"$RELEASES")" ] || { echo "::error::services가 비어 있다"; exit 1; }
          [ -n "$(tr -d ' ' <<<"$INJECT_RELEASES")" ] || { echo "::error::inject-services가 비어 있다"; exit 1; }
          for s in $INJECT_RELEASES; do
            case " $RELEASES " in *" $s "*) ;; *) echo "::error::inject-services의 $s가 services에 없다"; exit 1 ;; esac
          done
      - uses: ./.platform/.github/actions/kube-access
        with:
          target: ${{ inputs.target }}
          cluster: ${{ inputs.cluster }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ inputs.target == 'gcp' && vars.GCP_REGION || vars.AWS_REGION }}
          project: ${{ vars.GCP_PROJECT }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_IDENTITY }}

      - id: check
        name: 0. green 확인
        env:
          NEW_GREEN: ${{ inputs.new-green }}
        run: bash "$SCRIPTS/check.sh"
      - id: prepare
        if: steps.check.outputs.proceed == 'true' && steps.check.outputs.mode == 'new'
        name: 1. 훈련용 green 준비
        run: bash "$SCRIPTS/prepare.sh"
      - id: inject
        if: steps.check.outputs.proceed == 'true'
        name: 2. 장애 주입 (green 파드마다)
        run: bash "$SCRIPTS/inject.sh" | sed "s/^/[$SCENARIO] /"; exit "${PIPESTATUS[0]}"
      # 평소 배포와 완전히 같은 판단 코드를 manual로 돌린다. 실행(promote · abort)은 하지 않는다
      - id: judge
        if: steps.check.outputs.proceed == 'true' && steps.inject.outcome == 'success'
        name: 3. AI 승격 판단 (manual)
        uses: ./.platform/.github/actions/promote-judge
        with:
          releases: ${{ inputs.services }}
          namespace: test
          target: ${{ inputs.target }}
          environment: test
          mode: manual
          window-seconds: ${{ inputs.window-seconds }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      - id: blue
        if: steps.check.outputs.proceed == 'true' && steps.inject.outcome == 'success'
        name: 4. blue 확인 (active 서비스 smoke)
        continue-on-error: true
        run: bash "$SCRIPTS/blue.sh"
      - id: cleanup
        if: always() && steps.check.outputs.proceed == 'true'
        name: 5. 정리 (장애 해제 · Rollout 원상 복구)
        continue-on-error: true
        env:
          MODE: ${{ steps.check.outputs.mode }}
        run: bash "$SCRIPTS/cleanup.sh"
      - id: grade
        if: always() && steps.check.outputs.proceed == 'true'
        name: 6. 채점
        env:
          MODE: ${{ steps.check.outputs.mode }}
          JUDGMENT_DIR: ${{ runner.temp }}/promote-judge
        run: bash "$SCRIPTS/grade.sh"
      - if: steps.check.outputs.proceed != 'true'
        name: 거절
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          { echo "## 장애 훈련을 시작하지 않았어요 — \`$LABEL\`"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-drill-${{ inputs.scenario }}-${{ inputs.target-label || inputs.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chaos-drill/
            ${{ runner.temp }}/promote-judge/
          if-no-files-found: ignore

      # 감사 로그는 모든 대상이 같은 S3 버킷(Object Lock)에 남긴다. aws는 kube-access에서 이미 로그인했다.
      - if: always() && inputs.target != 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          action: drill
          target: ${{ env.LABEL }}
          result: ${{ steps.check.outputs.proceed != 'true' && 'cancelled' || steps.grade.outputs.result == 'pass' && 'success' || 'failure' }}
          requested-by: ${{ inputs.requested-by }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - if: always()
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          flow: 장애 훈련
          environment: test
          stage: ${{ steps.check.outputs.proceed != 'true' && '시작하지 않음' || '훈련 결과' }}
          next-action: ${{ steps.check.outputs.proceed != 'true' && steps.check.outputs.reason || steps.grade.outputs.promotion-unsafe == 'true' && '장애가 남아 있을 수 있어요. 이 green을 승격하지 말고 abort로 버려 주세요.' || steps.grade.outputs.result == 'pass' && '가드레일이 기대대로 막았어요. 승격 여부는 평소처럼 정하면 돼요.' || '어느 확인이 실패했는지 보고 가드레일 · 정리 상태를 점검해 주세요.' }}
          action: drill
          target: ${{ env.LABEL }}
          result: ${{ steps.check.outputs.proceed != 'true' && 'cancelled' || steps.grade.outputs.result == 'pass' && 'success' || 'failure' }}
          requested-by: ${{ inputs.requested-by }}
          details: ${{ steps.grade.outputs.details }}
          # 해제를 확인하지 못한 대기 중 green은 승격하면 안 된다. abort 버튼으로 버릴 수 있게 한다
          buttons: ${{ steps.grade.outputs.promotion-unsafe == 'true' && 'abort' || '' }}
          service: all@${{ inputs.target-label || inputs.target }}.test
