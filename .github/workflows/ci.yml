name: ci

# 이 레포(템플릿) 자체 검사: Terraform 포맷 · 검증, Helm 차트 lint, IaC 규정 검사, scripts/ 테스트.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: 모듈 · bootstrap validate
        run: |
          for d in modules/*/*/ bootstrap/; do
            ls "$d"*.tf >/dev/null 2>&1 || continue
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          helm lint charts/app --set image.repository=r --set image.tag=t
          helm lint charts/service-base --set namespace=x --set secret.secretName=x-env --set secret.remoteKey=x
          helm lint charts/platform-config

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/tests/run.sh

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
