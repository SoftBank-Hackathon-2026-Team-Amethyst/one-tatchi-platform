name: ci

# 이 레포(템플릿) 자체 검사: Terraform 포맷 · 검증, Helm 차트 lint, IaC 규정 검사, scripts/ · slack-bot 테스트.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - name: 모듈 · bootstrap validate
        run: |
          for d in modules/*/*/ bootstrap/ bootstrap/gcp/; do
            ls "$d"*.tf >/dev/null 2>&1 || continue
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
            case "$d" in modules/observability/*/|modules/ci_identity/gcp/|modules/preview_auth/aws/) [ ! -d "$d/tests" ] || terraform -chdir="$d" test ;; esac
            echo "::endgroup::"
          done

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          bash charts/app/tests/private-preview.sh
          bash charts/app/tests/preview-auth.sh
          bash charts/app/tests/probes.sh
          helm lint charts/app --set image.repository=r --set image.tag=t
          helm template digest charts/app --set image.repository=r --set image.tag=ignored --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > /tmp/digest.yaml
          grep -q 'image: "r@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' /tmp/digest.yaml
          if helm template invalid charts/app --set image.repository=r --set image.digest=broken >/dev/null 2>&1; then exit 1; fi
          helm lint charts/service-base --set namespace=x --set secret.secretName=x-env --set secret.remoteKey=x
          helm lint charts/platform-config
          helm lint charts/observability --set cluster=ci
          helm lint charts/grafana-wif
          helm template metrics charts/observability --set cluster=ci --set receiver.enabled=true --set receiver.host=metrics.example.com --set receiver.secretName=metrics-auth > /tmp/metrics.yaml
          helm template auth charts/app --set image.repository=r --set image.tag=t --set ingress.enabled=true --set ingress.group=g --set previewAuth.enabled=true --set previewAuth.host=green.example.test --set previewAuth.issuerUrl=https://issuer.example.test --set previewAuth.remoteKey=x --show-only templates/preview-auth.yaml > /tmp/preview-auth.yaml
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/metrics.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/preview-auth.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

  nginxlog-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker Hub 로그인 (pull 한도 회피, 설정이 없으면 건너뜀)
        if: vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: docker build -t nginxlog-exporter:ci images/nginxlog-exporter
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nginxlog-exporter:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/tests/run.sh
      - run: python3 -B -m unittest discover -s .github/actions/yolo-pr/tests -v
      - run: python3 -B -m unittest discover -s .github/actions/approval-timeout/tests -v
      - uses: astral-sh/setup-uv@v10.2.0
      # yolo 리포트: 수집 결과와 예시를 schema.json으로 검사한다 (T10)
      - run: uv run --no-project --with jsonschema python -B -m unittest discover -s .github/actions/yolo-report/tests -v
      # 배포 실패 진단: 증거 수집(cluster.sh · collect.py) 결과를 evidence.schema.json으로 검사한다 (T12)
      - run: uv run --no-project --with jsonschema python -B -m unittest discover -s .github/actions/failure-diagnosis/tests -v
      - run: bash skills/deploy-provision/tests/run.sh

  slack-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slack-bot
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
