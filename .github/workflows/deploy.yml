name: deploy

# 재사용 워크플로: checks에서 검사한 OCI 이미지를 발행하고 App Chart(OCI)로 test 또는 prod에 Blue-Green 배포한다.
# green이 뜨면 Paused(승격 대기)에서 멈추고, AI 승격 판단(promote-judge, T7)이 서비스를 묶어 promote · abort를 정한다.
#   promote-mode auto: 판단대로 바로 실행 (yolo). abort면 job이 실패해 다음 단계로 가지 않는다
#   promote-mode manual(기본): 실행하지 않고 판단 근거를 알림에 남긴다. 사람이 Slack 버튼으로 결정한다 (janto)
#   prod 배포는 같은 이미지가 test에서 승격(stable)된 뒤에만 진행한다 (require-test-promotion). 이미지는 빌드 직후 Trivy로 검사한 것만 push한다.
# 배포 대상(target)마다 다른 부분은 공통 액션 kube-access(클러스터 접속) · image-push(레지스트리)와
# 아래 "주소" 단계에만 있다. 나머지 단계와 App Chart는 모든 대상에서 같다.
on:
  workflow_call:
    inputs:
      onprem-runner-label:
        description: 기기별 runner 라벨 (onprem | onprem-secondary)
        type: string
        default: onprem
      target-label:
        description: 알림·승격 버튼의 대상 식별자. 비우면 target을 사용한다
        type: string
        default: ""
      target:
        description: "배포 대상: aws | gcp | onprem"
        type: string
        default: aws
      environment:
        description: >-
          환경 (test | prod). prod는 .deploy/config.yaml의 compliance로 GitHub environment를 고른다:
          regulated(또는 값 없음) → prod (사람 승인), none → prod-auto (자동 반영)
        type: string
        required: true
      services:
        description: >-
          배포할 서비스 JSON 배열. 예:
          [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
           {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
          배열 순서대로 하나씩 배포한다 (BE를 먼저).
          deploy/<target>/values.yaml이 있으면 모든 서비스에 덧붙인다.
        type: string
        required: true
      cluster:
        description: "aws: EKS 클러스터 이름, onprem: runner의 kube context 이름"
        type: string
        required: true
      namespace:
        description: 배포할 네임스페이스 (test | prod)
        type: string
        required: true
      ingress-group:
        description: aws만. ALB를 공유할 Ingress 그룹 이름
        type: string
        default: ""
      host:
        description: >-
          aws만. 서비스 도메인 (예: prod onetatchi.soulee.dev, test yolo.onetatchi.soulee.dev).
          Ingress가 있는 서비스를 HTTPS로 열고 80은 443으로 리다이렉트한다. 인증서는 ACM, DNS 레코드는 external-dns가 만든다.
          비우면 ALB 주소로 HTTP만 연다
        type: string
        default: ""
      preview-host:
        description: >-
          승인자용 green 미리보기 호스트 (ADR 0015, 예: prod green.onetatchi.soulee.dev).
          서비스 values의 previewAuth.enabled가 true인 서비스에만 previewAuth.host로 넘긴다. 비우면 values의 값을 쓴다
        type: string
        default: ""
      chart-version:
        description: App Chart 버전 (template_version과 같게)
        type: string
        required: true
      chart-repo:
        description: App Chart OCI 저장소
        type: string
        default: oci://ghcr.io/softbank-hackathon-2026-team-amethyst/charts
      template-ref:
        description: 공통 액션을 가져올 이 레포의 ref
        type: string
        default: v2
      yolo-auto-merge:
        description: test 승격 후 yolo 브랜치의 main PR 생성 · PR 검사 대기 · rebase 자동 머지 요청 (v1.14.0부터)
        type: boolean
        default: false
      promote-mode:
        description: "auto | manual | branch (yolo push와 yolo PR의 main 반영은 auto, 나머지는 manual)"
        type: string
        default: manual
      promote-window-seconds:
        description: AI 승격 판단 전에 green에 smoke 요청을 보내는 관찰 창(초). 서비스들은 동시에 관찰한다
        type: string
        default: "30"
      verify-observability:
        description: T17 demo-app 실측. main 수동 test 실행 전용, 60초 AI 검사 후 green만 장애 검증하고 정리
        type: boolean
        default: false
      observability-url:
        description: 검증할 중앙 Grafana HTTPS 기본 주소 (/grafana 포함)
        type: string
        default: ""
      require-test-promotion:
        description: >-
          prod 배포 전에 같은 OCI digest가 test에서 승격(stable)됐는지 확인한다. 승격 전이면 기다리고,
          promotion-wait-seconds 안에 승격되지 않으면 실패한다 (리뷰 지점 3을 건너뛰고 운영으로 가는 것을 막는다)
        type: string
        default: "true"
      test-namespace:
        description: require-test-promotion이 확인할 test 네임스페이스
        type: string
        default: test
      promotion-wait-seconds:
        description: test 승격을 기다리는 최대 시간(초)
        type: string
        default: "600"
      report-scan-path:
        description: yolo 배포 리포트(T10)가 비차단 취약점 · 라이선스를 다시 스캔할 경로 (checks의 scan-path와 같게)
        type: string
        default: "."
      report-iac-path:
        description: yolo 배포 리포트(T10)가 비차단 IaC 경고를 다시 스캔할 경로 (checks의 iac-path와 같게). 비우면 모으지 않는다
        type: string
        default: infra
    secrets:
      BOT_PRIVATE_KEY:
        description: yolo PR 생성용 GitHub App 키 (vars.BOT_CLIENT_ID와 함께)
        required: false
      SLACK_BOT_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        description: AI 승격 판단용 Claude API 키. 없으면 판단은 abort이고, manual이면 지금처럼 버튼으로 사람이 결정한다
        required: false

jobs:
  # 운영 관문 (T6): 운영 배포의 승인 여부는 배포하는 커밋의 compliance가 정한다. 값은 checks의 config-guard가 보호한다.
  # 값이 없거나 파일이 없으면 안전한 쪽(regulated)으로 본다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      mode: ${{ steps.mode.outputs.mode }}
      flow: ${{ steps.context.outputs.flow }}
    steps:
      - if: inputs.verify-observability
        name: T17 요청 제한 확인
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ] || [ "$ENVIRONMENT" != test ] || [ "$NAMESPACE" != test ]; then
            echo '::error::T17 verification requires workflow_dispatch on main, environment=test and namespace=test'
            exit 1
          fi
      - if: inputs.environment == 'prod'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .deploy
      - id: gate
        name: 운영 관문 (compliance)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" != prod ]; then
            echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          compliance=""
          if [ -f .deploy/config.yaml ]; then compliance="$(yq -r '.compliance // ""' .deploy/config.yaml)"; fi
          case "$compliance" in
            none) environment=prod-auto ;;
            regulated | "") compliance="${compliance:-regulated (값 없음)}"; environment=prod ;;
            *) echo "::error file=.deploy/config.yaml::compliance는 regulated | none 중 하나여야 한다 (지금: $compliance)"; exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "### 운영 관문: compliance=$compliance → environment \`$environment\`" >> "$GITHUB_STEP_SUMMARY"
      # 사람 승인이 필요하면 Slack에 승인 · 거절 버튼을 올린다 (T26). 봇(one-tatchi-bot)이 prod environment의
      # 승인 규칙(custom deployment protection rule)으로 등록돼 있어 버튼만으로 승인된다.
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: |
            .github/actions
            scripts/onprem
      - name: 대상 기기 확인
        env:
          TARGET: ${{ inputs.target }}
          TARGET_LABEL: ${{ inputs.target-label }}
          RUNNER_LABEL: ${{ inputs.onprem-runner-label }}
          CLUSTER: ${{ inputs.cluster }}
        run: python3 .platform/scripts/onprem/target.py
      - id: mode
        name: 배포 경로에 따른 승격 모드
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.verify-observability && 'manual' || inputs.promote-mode }}
        run: bash .platform/.github/actions/yolo-pr/mode.sh
      - id: context
        name: 알림용 배포 경로
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.mode.outputs.mode }}
          STRATEGY: ${{ inputs.promote-mode }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then flow="수동 재배포"
          elif [ "$STRATEGY" = branch ] && [ "$MODE" = auto ]; then flow="Yolo"
          elif [ "$MODE" = auto ]; then flow="자동 승격 배포"
          else flow="Janto / 일반 배포"; fi
          echo "flow=$flow" >> "$GITHUB_OUTPUT"
      - if: inputs.environment == 'test'
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          action: 배포 시작
          target: all@${{ inputs.target-label || inputs.target }}.test
          result: waiting
          flow: ${{ steps.context.outputs.flow }}
          environment: test
          stage: test 배포 준비 (Green 생성 전)
          next-action: 지금은 버튼을 누를 필요가 없어요. 이미지 발행과 Green 배포 결과를 기다려 주세요.
          details: main 실행은 main에 반영된 코드를, yolo/* 실행은 해당 브랜치 코드를 test 환경에 배포해요. 수동 실행은 선택한 커밋의 재배포이며 새 머지를 의미하지 않아요.
      - if: steps.gate.outputs.environment == 'prod'
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          flow: ${{ steps.context.outputs.flow }}
          environment: prod
          stage: 운영 배포 시작 승인 요청 (prod Green 생성 전)
          next-action: 운영 배포 승인을 누르면 prod 배포를 허용해요. PR 머지나 트래픽 승격 승인이 아니에요.
          action: 운영 승인 대기
          target: all@${{ inputs.target-label || inputs.target }}.prod
          result: waiting
          details: "규제 대상(compliance: regulated)이라 운영 반영 전에 사람 승인이 필요해요. test에서 검증한 같은 이미지를 올립니다."
          buttons: approve reject
          approval: ${{ github.run_id }}@prod

  # checks가 만든 OCI artifact만 발행한다. 맥북에서 빌드하거나 재검사하지 않는다.
  publish:
    needs: gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Registry publication uses the existing test identity, including yolo branches.
    # Production traffic changes remain behind the deploy job's prod approval.
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.publish.outputs.images }}
    concurrency:
      group: publish-${{ inputs.target }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - uses: actions/download-artifact@v8
        with:
          pattern: checked-image-${{ github.run_id }}-*
          path: ${{ runner.temp }}/checked-images
      - run: command -v skopeo >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y skopeo)
      - if: inputs.target == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        if: inputs.target == 'aws'
        uses: aws-actions/amazon-ecr-login@v2
      - if: inputs.target == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_IDENTITY }}
          project_id: ${{ vars.GCP_PROJECT }}
      - if: inputs.target == 'gcp'
        uses: google-github-actions/setup-gcloud@v3
      - id: publish
        env:
          TARGET: ${{ inputs.target }}
          SERVICES: ${{ inputs.services }}
          BUNDLES: ${{ runner.temp }}/checked-images
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .platform/.github/actions/image-push/publish.py

  # 서비스는 한 job 안에서 배열 순서대로(BE 먼저) 배포한다.
  # environment 승인은 job마다 걸리므로, 서비스마다 job을 나누면 prod 승인을 서비스 수만큼 받아야 한다.
  deploy:
    needs: [gate, publish]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      promoted: ${{ steps.yolo.outputs.promoted }}
      judged: ${{ steps.judge.outcome }}
    # onprem은 맥북의 self-hosted runner(바깥 방향 연결)에서 돈다. push 또는 main 수동 실행에서 호출한다.
    runs-on: ${{ inputs.target == 'onprem' && fromJSON(format('["self-hosted","{0}"]', inputs.onprem-runner-label)) || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.verify-observability && 45 || 20 }}
    # environment를 지정하면 GitHub Deployments에 배포 기록이 남는다. prod는 승인을 기다리고, prod-auto는 바로 반영한다.
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ steps.deploy.outputs.active }}
    # 같은 대상 · 환경의 배포는 동시에 돌지 않는다 (NFR-4). 대기 중인 배포는 최신 것 하나만 남는다.
    concurrency:
      group: deploy-${{ inputs.target-label || inputs.target }}-${{ inputs.cluster }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
      NAMESPACE: ${{ inputs.namespace }}
      TARGET: ${{ inputs.target }}
      SERVICES: ${{ inputs.services }}
      IMAGES: ${{ needs.publish.outputs.images }}
      VERIFY_OBSERVABILITY: ${{ inputs.verify-observability }}
      T17_KEY: ${{ inputs.target-label || inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      CLUSTER: ${{ inputs.cluster }}
      OBSERVABILITY_URL: ${{ inputs.observability-url }}
      OBSERVABILITY_LOG_GROUP: ${{ vars.OBSERVABILITY_LOG_GROUP }}
    steps:
      - if: inputs.verify-observability
        name: T17 산출물 경로
        run: printf 'T17_DIR=%s/t17-%s\n' "$RUNNER_TEMP" "$T17_KEY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - uses: ./.platform/.github/actions/kube-access
        with:
          target: ${{ inputs.target }}
          cluster: ${{ inputs.cluster }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ inputs.target == 'gcp' && vars.GCP_REGION || vars.AWS_REGION }}
          project: ${{ vars.GCP_PROJECT }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_IDENTITY }}
      - id: t17-preflight
        if: inputs.verify-observability
        name: T17 기존 blue · prod · Grafana 확인
        run: python3 .platform/scripts/observability/live.py preflight
      # 운영에는 test에서 승격(stable)된 같은 이미지만 올린다 (설계 6.2, 리뷰 지점 3).
      # test의 각 Rollout에서 stable ReplicaSet의 이미지 digest가 검사 산출물과 같아질 때까지 기다린다.
      - if: inputs.environment == 'prod' && inputs.require-test-promotion == 'true'
        name: test 승격 확인 (같은 이미지가 test에서 stable인지)
        env:
          TEST_NS: ${{ inputs.test-namespace }}
          WAIT: ${{ inputs.promotion-wait-seconds }}
        run: |
          NAMESPACE="$TEST_NS" WAIT_SECONDS="$WAIT" bash .platform/.github/actions/yolo-pr/verify.sh
          echo "### test 승격 확인: 검사한 OCI digest가 $TEST_NS 에서 stable" >> "$GITHUB_STEP_SUMMARY"
      - id: deploy
        name: 서비스 배포 (이미지 → helm upgrade → green 대기 → 주소)
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          INGRESS_GROUP: ${{ inputs.ingress-group }}
          HOST: ${{ inputs.host }}
          PREVIEW_HOST: ${{ inputs.preview-host }}
          CHART: ${{ inputs.chart-repo }}/app
          CHART_VERSION: ${{ inputs.chart-version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          wait_rollout() {
            for _ in $(seq 1 60); do
              phase="$(kubectl get rollout "$1" -n "$NAMESPACE" -o jsonpath='{.status.phase}')"
              echo "phase=$phase"
              case "$phase" in
                Paused|Healthy)
                  # 승격을 기다리는 green(Paused)만 AI 승격 판단 대상이다. 첫 배포처럼 바로 Healthy면 대상이 아니다.
                  [ "$phase" = Paused ] && paused+="$1 "
                  kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"; return 0 ;;
                Degraded) kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"; return 1 ;;
              esac
              sleep 10
            done
            kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"
            echo "::error::$1: 10분 안에 Paused · Healthy가 되지 않았다"
            return 1
          }

          # 서비스의 외부 주소. 없으면 active는 빈 값이다.
          service_urls() {
            local release="$1" values="$2" host="" green=""
            active="" preview="(비공개: 인증된 Kubernetes port-forward로 검증)"
            # 승인자용 미리보기를 켠 서비스는 SSO 로그인 뒤에서만 열리는 green 주소를 알린다.
            green="$(helm get values "$release" -n "$NAMESPACE" -a -o json | jq -r '.previewAuth | select(.enabled == true) | .host // empty')"
            if [ -n "$green" ]; then preview="https://$green/ (SSO 로그인 필요)"; fi
            case "$TARGET" in
              aws)
                # Ingress가 없는 서비스(예: FE가 클러스터 안에서 프록시하는 BE)는 외부 주소가 없다.
                # 처음 만든 ALB는 주소가 붙기까지 시간이 걸려 잠시 기다린다.
                if kubectl get ingress "$release" -n "$NAMESPACE" >/dev/null 2>&1; then
                  for _ in $(seq 1 30); do
                    host="$(kubectl get ingress "$release" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
                    [ -n "$host" ] && break
                    sleep 5
                  done
                fi
                if [ -n "$host" ] && [ -n "$HOST" ]; then active="https://$HOST/"
                elif [ -n "$host" ]; then active="http://$host/"; fi ;;
              gcp)
                if kubectl get ingress "$release" -n "$NAMESPACE" >/dev/null 2>&1; then
                  for _ in $(seq 1 120); do
                    host="$(kubectl get ingress "$release" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
                    [ -n "$host" ] && break
                    sleep 5
                  done
                  [ -n "$host" ] || { echo "::error::GKE Ingress address missing: $release"; return 1; }
                  active="http://$host/"
                fi ;;
              onprem)
                # Base service values express whether the service is public; onprem overlay disables only Ingress.
                if [ "$(yq -r '.ingress.enabled // false' "$values")" = true ]; then
                  active="$(python3 .platform/scripts/onprem/tunnel.py "$release" "$NAMESPACE")"
                fi ;;
            esac
          }

          first_active="" slack="" paused=""
          echo "### \`${TAG::7}\` → $TARGET / $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          count="$(jq length <<<"$SERVICES")"
          for idx in $(seq 0 $((count - 1))); do
            svc="$(jq -c ".[$idx]" <<<"$SERVICES")"
            release="$(jq -r .name <<<"$svc")"
            echo "::group::$release"

            image="$(jq -er --arg r "$release" '.[$r].repository' <<<"$IMAGES")"
            digest="$(jq -er --arg r "$release" '.[$r].digest' <<<"$IMAGES")"

            extra=()
            if [ -f "deploy/$TARGET/values.yaml" ]; then extra+=(-f "deploy/$TARGET/values.yaml"); fi
            if [ "$TARGET" = gcp ]; then extra+=(--set metrics.gcpManaged=true); fi
            migration="$(jq -r '.migration // ""' <<<"$svc")"
            if [ -n "$migration" ]; then extra+=(--set-file migration.sql="$migration"); fi
            if [ "$VERIFY_OBSERVABILITY" = true ]; then
              # 같은 digest도 새 green 생성. migration과 SSO preview를 끄고 loopback에서만 실측한다.
              extra+=(--set-string "env.T17_VALIDATION_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --set migration.enabled=false --set blueGreen.autoPromotionEnabled=false --set previewAuth.enabled=false)
            fi
            if [ "$TARGET" = aws ] && [ -n "$INGRESS_GROUP" ]; then extra+=(--set ingress.group="$INGRESS_GROUP"); fi
            if [ "$TARGET" = aws ] && [ -n "$HOST" ]; then extra+=(--set ingress.host="$HOST"); fi
            if [ -n "$PREVIEW_HOST" ]; then
              files=("$(jq -r .values <<<"$svc")")
              if [ -f "deploy/$TARGET/values.yaml" ]; then files+=("deploy/$TARGET/values.yaml"); fi
              # 뒤 파일이 앞 파일을 덮어쓰는 Helm 순서대로 합쳐 본다.
              if [ "$(yq eval-all -r '. as $v ireduce ({}; . * $v) | .previewAuth.enabled // false' "${files[@]}")" = true ]; then
                extra+=(--set previewAuth.host="$PREVIEW_HOST")
              fi
            fi
            # Helm 4 기본 server-side apply는 Argo Rollouts가 바꾼 Service selector와 충돌해 두 번째 배포부터 실패한다.
            helm upgrade --install "$release" "$CHART" \
              --version "$CHART_VERSION" \
              --namespace "$NAMESPACE" \
              -f "$(jq -r .values <<<"$svc")" \
              "${extra[@]}" \
              --set image.repository="$image" \
              --set image.tag="$TAG" \
              --set image.digest="$digest" \
              --server-side=false \
              --timeout 10m

            wait_rollout "$release"
            service_urls "$release" "$(jq -r .values <<<"$svc")"
            echo "::endgroup::"

            [ -z "$first_active" ] && [ -n "$active" ] && first_active="$active"
            slack+="*$release* active (blue): ${active:-(외부 주소 없음)} · preview (green): $preview"$'\n'
            echo "- **$release** active (blue): ${active:-(외부 주소 없음)} · preview (green): $preview" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo "active=$first_active"
            echo "names=$(jq -r 'map(.name) | join(" ")' <<<"$SERVICES")"
            echo "paused=${paused% }"
            echo "slack<<END"; printf '%s' "$slack"; echo "END"
          } >> "$GITHUB_OUTPUT"
      - if: inputs.verify-observability
        name: T17 private green 식별 · smoke 이전 카운터 기록
        run: python3 .platform/scripts/observability/live.py prepare
      # AI 승격 판단 (T7, ADR 0002~0005). Paused인 서비스들을 묶어 판단한다.
      - id: judge
        if: steps.deploy.outputs.paused != ''
        uses: ./.platform/.github/actions/promote-judge
        with:
          releases: ${{ steps.deploy.outputs.paused }}
          namespace: ${{ inputs.namespace }}
          target: ${{ inputs.target }}
          environment: ${{ inputs.environment }}
          mode: ${{ needs.gate.outputs.mode }}
          window-seconds: ${{ inputs.verify-observability && '60' || inputs.promote-window-seconds }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      - id: yolo
        name: yolo PR 전에 실제 test 승격 확인
        if: inputs.yolo-auto-merge && inputs.environment == 'test' && needs.gate.outputs.mode == 'auto' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/yolo/')
        env:
          REPORT: ${{ runner.temp }}/yolo-promotion.json
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .platform/.github/actions/yolo-pr/verify.sh
          infra=false; [ ! -f .github/workflows/infra.yml ] || infra=true
          jq -n --argjson infra_workflow "$infra" --arg sha "$TAG" --arg target "$TARGET" --arg actor "$ACTOR" --arg run_url "$RUN_URL" \
            --arg compliance "$(yq -r '.compliance' .deploy/config.yaml)" \
            --arg template_version "$(yq -r '.template_version' .deploy/config.yaml)" \
            '{sha:$sha,target:$target,actor:$actor,run_url:$run_url,compliance:$compliance,
              template_version:$template_version,environment:"test",promoted:true,infra_workflow:$infra_workflow}' > "$REPORT"
      - if: steps.yolo.outputs.promoted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yolo-promotion
          path: ${{ runner.temp }}/yolo-promotion.json
          if-no-files-found: error
      # 판단 근거(지표 · 규칙 판정 · AI 답)는 T10 yolo 배포 리포트가 읽는다.
      - if: always() && steps.judge.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: promote-judgment-${{ inputs.environment }}
          path: ${{ runner.temp }}/promote-judge/
          if-no-files-found: ignore
      # 감사 로그는 모든 대상이 같은 S3 버킷(Object Lock)에 남긴다. aws는 kube-access에서 이미 로그인했다.
      - if: always() && inputs.target != 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: evidence
        name: AI 판단 근거를 Grafana에 게시
        if: always() && steps.judge.outcome != 'skipped' && vars.OBSERVABILITY_LOG_GROUP != ''
        continue-on-error: true
        uses: ./.platform/.github/actions/publish-metrics
        with:
          report-dir: ${{ runner.temp }}/promote-judge
          log-group: ${{ vars.OBSERVABILITY_LOG_GROUP }}
          target: ${{ inputs.target }}
          environment: ${{ inputs.environment }}
          cluster: ${{ inputs.cluster }}
          sha: ${{ env.TAG }}
      - if: always() && steps.evidence.outcome == 'failure'
        run: echo 'Grafana 근거 게시 실패 — promote-judgment artifact에서 원본을 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
      - id: t17-verify
        if: inputs.verify-observability
        name: T17 실측 · Grafana 조회 · AI 원본 대조
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          [ "$EVIDENCE_OUTCOME" = success ] || { echo '::error::T17 requires successful AI evidence publication'; exit 1; }
          python3 .platform/scripts/observability/live.py verify
      - id: t17-cleanup
        if: always() && inputs.verify-observability && steps.t17-preflight.outcome == 'success'
        name: T17 장애 복구 · 이번 실행의 green만 정리
        run: python3 .platform/scripts/observability/live.py cleanup
      - if: always() && inputs.verify-observability
        uses: actions/upload-artifact@v7
        with:
          name: t17-observability-${{ inputs.target-label || inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.T17_DIR }}/evidence/
          if-no-files-found: warn
      # 사람 승인을 거친 운영 배포는 승인한 사람을 requested_by로 남긴다 (T26).
      # protection rule 승인자는 API로 읽을 수 없어서, slack-bot이 승인하면서 이 커밋에 남긴 표지를 읽는다.
      - id: approver
        if: always() && needs.gate.outputs.environment == 'prod'
        name: 운영 승인자 (slack-bot 표지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          by="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\") | .body
              | capture(\"one-tatchi-approval run=${GITHUB_RUN_ID} environment=prod state=approved by=(?<by>[^ ]+) -->\")
              | .by" | tail -n 1)" || by=""
          [ -n "$by" ] || echo "::warning::승인 표지를 찾지 못했다. 감사 로그 requested_by는 actor로 남는다"
          echo "requested-by=$by" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          flow: ${{ needs.gate.outputs.flow }}
          environment: ${{ inputs.environment }}
          stage: Green 배포·검사 결과
          next-action: ${{ job.status != 'success' && '실행 로그를 확인해 주세요. 성공이나 승격 완료 상태가 아니에요.' || (steps.judge.outputs.executed == 'promote' && '자동 트래픽 승격을 실행했어요. 이상이 있으면 되돌리기를 요청하세요.' || (steps.judge.outputs.executed == 'abort' && 'Green을 취소했어요. 실패 근거를 확인해 주세요.' || '검사·AI 판단 근거를 확인하고 트래픽 승격 또는 Green 취소를 선택하세요. 승격 완료 알림이 아니에요.')) }}
          action: deploy
          target: all@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
          result: ${{ job.status }}
          requested-by: ${{ steps.approver.outputs.requested-by }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      # auto에서 AI가 실제로 promote · abort했으면 그 조작도 남긴다. abort는 의도한 결과라 success로 적는다.
      - if: always() && steps.judge.outputs.executed != ''
        uses: ./.platform/.github/actions/audit-log
        with:
          action: ${{ steps.judge.outputs.executed }}
          target: all@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
          result: ${{ (steps.judge.outputs.executed == 'abort' || steps.judge.outcome == 'success') && 'success' || 'failure' }}
          requested-by: ai-judge
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - id: notify
        if: always()
        name: 알림 내용 (AI 판단 · 버튼)
        env:
          STATUS: ${{ job.status }}
          MODE: ${{ needs.gate.outputs.mode }}
          URLS: ${{ steps.deploy.outputs.slack }}
          DECISION: ${{ steps.judge.outputs.decision }}
          REASON: ${{ steps.judge.outputs.reason }}
          EXECUTED: ${{ steps.judge.outputs.executed }}
          T17_CLEANUP: ${{ steps.t17-cleanup.outcome }}
        run: |
          # 버튼: manual이면 사람이 고를 promote · abort, auto로 promote했으면 되돌리기(undo)만
          buttons=""
          if [ "$STATUS" = success ] && [ "$VERIFY_OBSERVABILITY" != true ]; then
            if [ "$MODE" = auto ]; then
              [ "$EXECUTED" = promote ] && buttons=undo
            else
              buttons="promote abort"
            fi
          fi
          if [ -n "$EXECUTED" ]; then how="$EXECUTED 실행함"; else how="실행 안 함"; fi
          {
            echo "buttons=$buttons"
            echo "details<<__DETAILS__"
            [ -z "$URLS" ] || printf '%s\n' "$URLS"
            [ -z "$DECISION" ] || echo "AI 판단: *$DECISION* ($MODE, $how) — $REASON"
            [ "$VERIFY_OBSERVABILITY" != true ] || echo "T17 실측 실행: green 정리=$T17_CLEANUP. Actions의 t17-observability artifact를 확인하세요."
            echo "__DETAILS__"
          } >> "$GITHUB_OUTPUT"
      - if: always()
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          action: deploy
          target: ${{ steps.deploy.outputs.names || 'all' }}@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
          service: all@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
          result: ${{ job.status }}
          details: ${{ steps.notify.outputs.details }}
          buttons: ${{ steps.notify.outputs.buttons }}

  # yolo 배포 리포트 (T10, 설계 6.3 · FR-12). yolo push의 test 배포가 끝나면(승격 · abort 모두) 누가 · 무엇을 ·
  # 어떤 문제를 안고 배포했는지 S3 감사 로그에 남기고, 새 경고 · AI 수정 · 수집 실패가 있으면 yolo-debt 이슈를 연다.
  # 리포트가 실패하면 yolo-pr(main 자동 머지)로 가지 않는다. 기록 없이 리뷰 없는 변경이 main에 들어가지 않게 한다.
  yolo-report:
    needs: [gate, deploy]
    if: >-
      always() && inputs.yolo-auto-merge && inputs.environment == 'test' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/heads/yolo/') &&
      needs.gate.result == 'success' && needs.gate.outputs.mode == 'auto' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 감사 로그 버킷 쓰기(AWS Deploy 역할)는 main 또는 environment가 있는 job만 받는다 (modules/ci_identity/aws).
    environment: test
    concurrency:
      group: yolo-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # 수정 커밋과 기준 커밋(main과 갈라진 지점)을 찾으려면 전체 이력이 필요하다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: |
            .github/actions/yolo-report
            .github/actions/audit-log
          persist-credentials: false
      - if: needs.deploy.outputs.promoted == 'true'
        uses: actions/download-artifact@v8
        with:
          name: yolo-promotion
          path: ${{ runner.temp }}/yolo-promotion
      # 판단 근거가 없으면 리포트가 수집 실패로 남긴다(판단이 돌지 않은 배포는 미실행으로 남긴다).
      - if: needs.deploy.outputs.judged == 'success' || needs.deploy.outputs.judged == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: promote-judgment-${{ inputs.environment }}
          path: ${{ runner.temp }}/promote-judge
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - id: report
        uses: ./.platform/.github/actions/yolo-report
        with:
          target: ${{ inputs.target }}
          target-label: ${{ inputs.target-label || inputs.target }}
          promotion: ${{ runner.temp }}/yolo-promotion/yolo-promotion.json
          judgment-dir: ${{ runner.temp }}/promote-judge
          judge-outcome: ${{ needs.deploy.outputs.judged || 'skipped' }}
          scan-path: ${{ inputs.report-scan-path }}
          iac-path: ${{ inputs.report-iac-path }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
          github-token: ${{ steps.app.outputs.token }}
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          action: yolo-report
          target: all@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
          result: ${{ job.status }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yolo-report
          path: ${{ runner.temp }}/yolo-report/
          if-no-files-found: ignore

  yolo-pr:
    needs: [gate, deploy, yolo-report]
    if: inputs.yolo-auto-merge && needs.deploy.outputs.promoted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: yolo-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: .github/actions/yolo-pr
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: yolo-promotion
          path: ${{ runner.temp }}/yolo-promotion
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: yolo PR 생성 · 검사 확인 · 자동 머지
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPORT: ${{ runner.temp }}/yolo-promotion/yolo-promotion.json
        run: python3 .platform/.github/actions/yolo-pr/pr.py
