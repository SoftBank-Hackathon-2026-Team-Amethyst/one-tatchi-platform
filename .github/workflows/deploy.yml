name: deploy

# 재사용 워크플로: 이미지를 빌드하고 App Chart(OCI)로 test 또는 prod에 Blue-Green 배포한다.
# green이 뜨면 Paused(승격 대기)에서 멈춘다. 승격 판단은 별도 단계(T7)가 맡는다.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment 이름 (test | prod). prod는 승인 규칙이 걸린다"
        type: string
        required: true
      services:
        description: >-
          배포할 서비스 JSON 배열. 예:
          [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
           {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
          배열 순서대로 하나씩 배포한다 (BE를 먼저).
        type: string
        required: true
      cluster:
        description: EKS 클러스터 이름
        type: string
        required: true
      namespace:
        description: 배포할 네임스페이스 (test | prod)
        type: string
        required: true
      ingress-group:
        description: ALB를 공유할 Ingress 그룹 이름
        type: string
        required: true
      chart-version:
        description: App Chart 버전 (template_version과 같게)
        type: string
        required: true
      chart-repo:
        description: App Chart OCI 저장소
        type: string
        default: oci://ghcr.io/softbank-hackathon-2026-team-amethyst/charts
      template-ref:
        description: 공통 액션을 가져올 이 레포의 ref
        type: string
        default: v1
    secrets:
      SLACK_BOT_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment를 지정하면 GitHub Deployments에 배포 기록이 남고, prod는 승인을 기다린다.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.urls.outputs.active }}
    strategy:
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    env:
      RELEASE: ${{ matrix.service.name }}
      TAG: ${{ github.sha }}
      NAMESPACE: ${{ inputs.namespace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - uses: ./.platform/.github/actions/kube-access
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          cluster: ${{ inputs.cluster }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: 이미지 빌드 · push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.service.name }}
        run: |
          # 태그 덮어쓰기 금지(immutable)라 재실행 시 이미 있으면 건너뛴다.
          if aws ecr describe-images --repository-name "$RELEASE" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "image $IMAGE:$TAG already exists"
          else
            docker build -t "$IMAGE:$TAG" "${{ matrix.service.path }}"
            docker push "$IMAGE:$TAG"
          fi
      - name: helm upgrade (green 생성)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ matrix.service.name }}
          MIGRATION: ${{ matrix.service.migration }}
        run: |
          extra=()
          if [ -n "$MIGRATION" ]; then extra+=(--set-file migration.sql="$MIGRATION"); fi
          helm upgrade --install "$RELEASE" "${{ inputs.chart-repo }}/app" \
            --version "${{ inputs.chart-version }}" \
            --namespace "$NAMESPACE" \
            -f "${{ matrix.service.values }}" \
            --set image.repository="$IMAGE" \
            --set image.tag="$TAG" \
            --set ingress.group="${{ inputs.ingress-group }}" \
            "${extra[@]}" \
            --timeout 10m
      - name: green 대기 (Paused) 또는 Healthy
        run: |
          for i in $(seq 1 60); do
            phase="$(kubectl get rollout "$RELEASE" -n "$NAMESPACE" -o jsonpath='{.status.phase}')"
            echo "phase=$phase"
            case "$phase" in
              Paused|Healthy) break ;;
              Degraded) kubectl argo rollouts get rollout "$RELEASE" -n "$NAMESPACE"; exit 1 ;;
            esac
            sleep 10
          done
          kubectl argo rollouts get rollout "$RELEASE" -n "$NAMESPACE"
      - id: urls
        run: |
          host="$(kubectl get ingress "$RELEASE" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          echo "active=http://$host/" >> "$GITHUB_OUTPUT"
          {
            echo "slack<<END"
            echo "active (blue): http://$host/"
            echo "preview (green): http://$host:8080/"
            echo "END"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $RELEASE @ \`${TAG::7}\` → ${{ inputs.environment }}"
            echo "- active (blue): http://$host/"
            echo "- preview (green): http://$host:8080/"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          action: deploy
          target: ${{ matrix.service.name }}@${{ inputs.environment }}
          result: ${{ job.status }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - if: always()
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          action: deploy
          target: ${{ matrix.service.name }}@${{ inputs.environment }}
          result: ${{ job.status }}
          details: ${{ steps.urls.outputs.slack }}
          buttons: ${{ job.status == 'success' && 'promote abort' || '' }}
