name: deploy

# 재사용 워크플로: 이미지를 빌드하고 App Chart(OCI)로 test 또는 prod에 Blue-Green 배포한다.
# green이 뜨면 Paused(승격 대기)에서 멈추고, AI 승격 판단(promote-judge, T7)이 서비스를 묶어 promote · abort를 정한다.
#   promote-mode auto: 판단대로 바로 실행 (yolo). abort면 job이 실패해 다음 단계로 가지 않는다
#   promote-mode manual(기본): 실행하지 않고 판단 근거를 알림에 남긴다. 사람이 Slack 버튼으로 결정한다 (janto)
# 배포 대상(target)마다 다른 부분은 공통 액션 kube-access(클러스터 접속) · image-push(레지스트리)와
# 아래 "주소" 단계에만 있다. 나머지 단계와 App Chart는 모든 대상에서 같다.
on:
  workflow_call:
    inputs:
      target:
        description: "배포 대상: aws | onprem (gcp는 T4)"
        type: string
        default: aws
      environment:
        description: >-
          환경 (test | prod). prod는 .deploy/config.yaml의 compliance로 GitHub environment를 고른다:
          regulated(또는 값 없음) → prod (사람 승인), none → prod-auto (자동 반영)
        type: string
        required: true
      services:
        description: >-
          배포할 서비스 JSON 배열. 예:
          [{"name":"demo-app-be","path":"be","values":"deploy/values-be.yaml","migration":"db/init.sql"},
           {"name":"demo-app-fe","path":"fe","values":"deploy/values-fe.yaml"}]
          배열 순서대로 하나씩 배포한다 (BE를 먼저).
          deploy/<target>/values.yaml이 있으면 모든 서비스에 덧붙인다.
        type: string
        required: true
      cluster:
        description: "aws: EKS 클러스터 이름, onprem: runner의 kube context 이름"
        type: string
        required: true
      namespace:
        description: 배포할 네임스페이스 (test | prod)
        type: string
        required: true
      ingress-group:
        description: aws만. ALB를 공유할 Ingress 그룹 이름
        type: string
        default: ""
      host:
        description: >-
          aws만. 서비스 도메인 (예: prod onetatchi.soulee.dev, test yolo.onetatchi.soulee.dev).
          Ingress가 있는 서비스를 HTTPS로 열고 80은 443으로 리다이렉트한다. 인증서는 ACM, DNS 레코드는 external-dns가 만든다.
          비우면 ALB 주소로 HTTP만 연다
        type: string
        default: ""
      chart-version:
        description: App Chart 버전 (template_version과 같게)
        type: string
        required: true
      chart-repo:
        description: App Chart OCI 저장소
        type: string
        default: oci://ghcr.io/softbank-hackathon-2026-team-amethyst/charts
      template-ref:
        description: 공통 액션을 가져올 이 레포의 ref
        type: string
        default: v1
      promote-mode:
        description: "AI 승격 판단 결과를 실행할지: auto (yolo) | manual (janto, 사람이 버튼으로 실행)"
        type: string
        default: manual
      promote-window-seconds:
        description: AI 승격 판단 전에 green에 smoke 요청을 보내는 관찰 창(초). 서비스들은 동시에 관찰한다
        type: string
        default: "30"
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        description: AI 승격 판단용 Claude API 키. 없으면 판단은 abort이고, manual이면 지금처럼 버튼으로 사람이 결정한다
        required: false

jobs:
  # 운영 관문 (T6): 운영 배포의 승인 여부는 배포하는 커밋의 compliance가 정한다. 값은 checks의 config-guard가 보호한다.
  # 값이 없거나 파일이 없으면 안전한 쪽(regulated)으로 본다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - if: inputs.environment == 'prod'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .deploy
      - id: gate
        name: 운영 관문 (compliance)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" != prod ]; then
            echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          compliance=""
          if [ -f .deploy/config.yaml ]; then compliance="$(yq -r '.compliance // ""' .deploy/config.yaml)"; fi
          case "$compliance" in
            none) environment=prod-auto ;;
            regulated | "") compliance="${compliance:-regulated (값 없음)}"; environment=prod ;;
            *) echo "::error file=.deploy/config.yaml::compliance는 regulated | none 중 하나여야 한다 (지금: $compliance)"; exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "### 운영 관문: compliance=$compliance → environment \`$environment\`" >> "$GITHUB_STEP_SUMMARY"
      # 사람 승인이 필요하면 Slack에 승인 · 거절 버튼을 올린다 (T26). 봇(one-tatchi-bot)이 prod environment의
      # 승인 규칙(custom deployment protection rule)으로 등록돼 있어 버튼만으로 승인된다.
      - if: steps.gate.outputs.environment == 'prod'
        uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: .github/actions
      - if: steps.gate.outputs.environment == 'prod'
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          action: 운영 승인 대기
          target: all@${{ inputs.target }}.prod
          result: waiting
          details: "규제 대상(compliance: regulated)이라 운영 반영 전에 사람 승인이 필요해요. test에서 검증한 같은 이미지를 올립니다."
          buttons: approve reject
          approval: ${{ github.run_id }}@prod

  # 서비스는 한 job 안에서 배열 순서대로(BE 먼저) 배포한다.
  # environment 승인은 job마다 걸리므로, 서비스마다 job을 나누면 prod 승인을 서비스 수만큼 받아야 한다.
  deploy:
    needs: gate
    # onprem은 맥북의 self-hosted runner(바깥 방향 연결)에서 돈다. push 이벤트로만 호출한다.
    runs-on: ${{ inputs.target == 'onprem' && fromJSON('["self-hosted","onprem"]') || 'ubuntu-latest' }}
    # environment를 지정하면 GitHub Deployments에 배포 기록이 남는다. prod는 승인을 기다리고, prod-auto는 바로 반영한다.
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ steps.deploy.outputs.active }}
    # 같은 대상 · 환경의 배포는 동시에 돌지 않는다 (NFR-4). 대기 중인 배포는 최신 것 하나만 남는다.
    concurrency:
      group: deploy-${{ inputs.target }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
      NAMESPACE: ${{ inputs.namespace }}
      TARGET: ${{ inputs.target }}
      SERVICES: ${{ inputs.services }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - uses: ./.platform/.github/actions/kube-access
        with:
          target: ${{ inputs.target }}
          cluster: ${{ inputs.cluster }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
      - id: ecr
        if: inputs.target == 'aws'
        uses: aws-actions/amazon-ecr-login@v2
      - id: deploy
        name: 서비스 배포 (이미지 → helm upgrade → green 대기 → 주소)
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          INGRESS_GROUP: ${{ inputs.ingress-group }}
          HOST: ${{ inputs.host }}
          CHART: ${{ inputs.chart-repo }}/app
          CHART_VERSION: ${{ inputs.chart-version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          wait_rollout() {
            for _ in $(seq 1 60); do
              phase="$(kubectl get rollout "$1" -n "$NAMESPACE" -o jsonpath='{.status.phase}')"
              echo "phase=$phase"
              case "$phase" in
                Paused|Healthy)
                  # 승격을 기다리는 green(Paused)만 AI 승격 판단 대상이다. 첫 배포처럼 바로 Healthy면 대상이 아니다.
                  [ "$phase" = Paused ] && paused+="$1 "
                  kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"; return 0 ;;
                Degraded) kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"; return 1 ;;
              esac
              sleep 10
            done
            kubectl argo rollouts get rollout "$1" -n "$NAMESPACE"
            echo "::error::$1: 10분 안에 Paused · Healthy가 되지 않았다"
            return 1
          }

          # 서비스의 외부 주소. 없으면 active는 빈 값이다.
          service_urls() {
            local release="$1" host="" tunnel
            active="" preview="(외부 주소 없음)"
            case "$TARGET" in
              aws)
                # Ingress가 없는 서비스(예: FE가 클러스터 안에서 프록시하는 BE)는 외부 주소가 없다.
                # 처음 만든 ALB는 주소가 붙기까지 시간이 걸려 잠시 기다린다.
                if kubectl get ingress "$release" -n "$NAMESPACE" >/dev/null 2>&1; then
                  for _ in $(seq 1 30); do
                    host="$(kubectl get ingress "$release" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
                    [ -n "$host" ] && break
                    sleep 5
                  done
                fi
                if [ -n "$host" ] && [ -n "$HOST" ]; then active="https://$HOST/"; preview="https://$HOST:8080/"
                elif [ -n "$host" ]; then active="http://$host/"; preview="http://$host:8080/"; fi ;;
              onprem)
                # Cloudflare Tunnel이 FE Service로 바로 연결한다. 환경별 터널(cloudflared-<네임스페이스>)이 있으면 그것을 쓴다.
                # 터널의 연결 대상과 같은 서비스에만 주소를 붙인다. green은 터널에 열지 않는다.
                tunnel="cloudflared-$NAMESPACE"
                kubectl -n cloudflared get deploy "$tunnel" >/dev/null 2>&1 || tunnel=cloudflared
                if kubectl -n cloudflared get deploy "$tunnel" -o jsonpath='{.spec.template.spec.containers[0].args}' | grep -q "//$release\.$NAMESPACE\."; then
                  active="$(kubectl -n cloudflared logs "deploy/$tunnel" | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1)/"
                fi
                preview="kubectl -n $NAMESPACE port-forward svc/$release-preview 8080:$(kubectl get svc "$release-preview" -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].port}')" ;;
            esac
          }

          first_active="" slack="" paused=""
          echo "### \`${TAG::7}\` → $TARGET / $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          count="$(jq length <<<"$SERVICES")"
          for idx in $(seq 0 $((count - 1))); do
            svc="$(jq -c ".[$idx]" <<<"$SERVICES")"
            release="$(jq -r .name <<<"$svc")"
            echo "::group::$release"

            image="$(.platform/.github/actions/image-push/push.sh "$TARGET" "$release" "$(jq -r .path <<<"$svc")" "$TAG" | tail -1)"

            extra=()
            if [ -f "deploy/$TARGET/values.yaml" ]; then extra+=(-f "deploy/$TARGET/values.yaml"); fi
            migration="$(jq -r '.migration // ""' <<<"$svc")"
            if [ -n "$migration" ]; then extra+=(--set-file migration.sql="$migration"); fi
            if [ -n "$INGRESS_GROUP" ]; then extra+=(--set ingress.group="$INGRESS_GROUP"); fi
            if [ -n "$HOST" ]; then extra+=(--set ingress.host="$HOST"); fi
            # Helm 4 기본 server-side apply는 Argo Rollouts가 바꾼 Service selector와 충돌해 두 번째 배포부터 실패한다.
            helm upgrade --install "$release" "$CHART" \
              --version "$CHART_VERSION" \
              --namespace "$NAMESPACE" \
              -f "$(jq -r .values <<<"$svc")" \
              "${extra[@]}" \
              --set image.repository="$image" \
              --set image.tag="$TAG" \
              --server-side=false \
              --timeout 10m

            wait_rollout "$release"
            service_urls "$release"
            echo "::endgroup::"

            [ -z "$first_active" ] && [ -n "$active" ] && first_active="$active"
            slack+="*$release* active (blue): ${active:-(외부 주소 없음)} · preview (green): $preview"$'\n'
            echo "- **$release** active (blue): ${active:-(외부 주소 없음)} · preview (green): $preview" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo "active=$first_active"
            echo "names=$(jq -r 'map(.name) | join(" ")' <<<"$SERVICES")"
            echo "paused=${paused% }"
            echo "slack<<END"; printf '%s' "$slack"; echo "END"
          } >> "$GITHUB_OUTPUT"
      # AI 승격 판단 (T7, ADR 0002~0005). Paused인 서비스들을 묶어 판단한다.
      - id: judge
        if: steps.deploy.outputs.paused != ''
        uses: ./.platform/.github/actions/promote-judge
        with:
          releases: ${{ steps.deploy.outputs.paused }}
          namespace: ${{ inputs.namespace }}
          target: ${{ inputs.target }}
          environment: ${{ inputs.environment }}
          mode: ${{ inputs.promote-mode }}
          window-seconds: ${{ inputs.promote-window-seconds }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # 판단 근거(지표 · 규칙 판정 · AI 답)는 T10 yolo 배포 리포트가 읽는다.
      - if: always() && steps.judge.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: promote-judgment-${{ inputs.environment }}
          path: ${{ runner.temp }}/promote-judge/
          if-no-files-found: ignore
      # 감사 로그는 모든 대상이 같은 S3 버킷(Object Lock)에 남긴다. aws는 kube-access에서 이미 로그인했다.
      - if: always() && inputs.target != 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          action: deploy
          target: all@${{ inputs.target }}.${{ inputs.environment }}
          result: ${{ job.status }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      # auto에서 AI가 실제로 promote · abort했으면 그 조작도 남긴다. abort는 의도한 결과라 success로 적는다.
      - if: always() && steps.judge.outputs.executed != ''
        uses: ./.platform/.github/actions/audit-log
        with:
          action: ${{ steps.judge.outputs.executed }}
          target: all@${{ inputs.target }}.${{ inputs.environment }}
          result: ${{ (steps.judge.outputs.executed == 'abort' || steps.judge.outcome == 'success') && 'success' || 'failure' }}
          requested-by: ai-judge
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - id: notify
        if: always()
        name: 알림 내용 (AI 판단 · 버튼)
        env:
          STATUS: ${{ job.status }}
          MODE: ${{ inputs.promote-mode }}
          URLS: ${{ steps.deploy.outputs.slack }}
          DECISION: ${{ steps.judge.outputs.decision }}
          REASON: ${{ steps.judge.outputs.reason }}
          EXECUTED: ${{ steps.judge.outputs.executed }}
        run: |
          # 버튼: manual이면 사람이 고를 promote · abort, auto로 promote했으면 되돌리기(undo)만
          buttons=""
          if [ "$STATUS" = success ]; then
            if [ "$MODE" = auto ]; then
              [ "$EXECUTED" = promote ] && buttons=undo
            else
              buttons="promote abort"
            fi
          fi
          if [ -n "$EXECUTED" ]; then how="$EXECUTED 실행함"; else how="실행 안 함"; fi
          {
            echo "buttons=$buttons"
            echo "details<<__DETAILS__"
            [ -z "$URLS" ] || printf '%s\n' "$URLS"
            [ -z "$DECISION" ] || echo "AI 판단: *$DECISION* ($MODE, $how) — $REASON"
            echo "__DETAILS__"
          } >> "$GITHUB_OUTPUT"
      - if: always()
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          action: deploy
          target: ${{ steps.deploy.outputs.names || 'all' }}@${{ inputs.target }}.${{ inputs.environment }}
          service: all@${{ inputs.target }}.${{ inputs.environment }}
          result: ${{ job.status }}
          details: ${{ steps.notify.outputs.details }}
          buttons: ${{ steps.notify.outputs.buttons }}
