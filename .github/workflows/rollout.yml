name: rollout

# 재사용 워크플로: Blue-Green 조작 (T26).
#   promote: green을 운영 트래픽으로 승격
#   abort:   승격 전 green을 버리고 blue 유지
#   undo:    승격 후 문제가 생겼을 때 직전 버전으로 되돌림
# 대상 레포의 workflow_dispatch 워크플로가 호출하고, 그 워크플로는 slack-bot이 Slack 버튼으로 실행한다.
# 봇은 클러스터 권한이 없다. 실제 반영은 이 워크플로만 하고, 버튼을 누른 사람은 requested-by로 감사 로그에 남는다.
on:
  workflow_call:
    inputs:
      onprem-runner-label:
        type: string
        default: onprem
      target-label:
        type: string
        default: ""
      action:
        description: promote | abort | undo
        type: string
        required: true
      release:
        description: 조작할 서비스(Rollout) 이름 또는 all
        type: string
        required: true
      services:
        description: release가 all일 때 조작할 서비스 이름들 (공백 구분, 예 "demo-app-be demo-app-fe")
        type: string
        default: ""
      target:
        description: "배포 대상: aws | gcp | onprem"
        type: string
        default: aws
      environment:
        description: test | prod (알림 · 감사 로그 표기용)
        type: string
        required: true
      cluster:
        description: "aws: EKS 클러스터 이름, onprem: runner의 kube context 이름"
        type: string
        required: true
      namespace:
        description: 서비스 네임스페이스 (test | prod)
        type: string
        required: true
      requested-by:
        description: 대신 실행을 요청한 주체 (slack-bot이 Slack 사용자를 넣는다)
        type: string
        default: ""
      template-ref:
        description: 공통 액션을 가져올 이 레포의 ref
        type: string
        default: v2
    secrets:
      SLACK_BOT_TOKEN:
        required: false

jobs:
  device:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: scripts/onprem
      - name: 대상 기기 확인
        env:
          TARGET: ${{ inputs.target }}
          TARGET_LABEL: ${{ inputs.target-label }}
          RUNNER_LABEL: ${{ inputs.onprem-runner-label }}
          CLUSTER: ${{ inputs.cluster }}
        run: python3 .platform/scripts/onprem/target.py
  rollout:
    needs: device
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # onprem은 맥북의 self-hosted runner에서 돈다 (deploy.yml과 같음)
    runs-on: ${{ inputs.target == 'onprem' && fromJSON(format('["self-hosted","{0}"]', inputs.onprem-runner-label)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    # 같은 대상 · 환경의 조작은 한 번에 하나씩
    concurrency:
      group: rollout-${{ inputs.target-label || inputs.target }}-${{ inputs.cluster }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ACTION: ${{ inputs.action }}
      NAMESPACE: ${{ inputs.namespace }}
      LABEL: ${{ inputs.release }}@${{ inputs.target-label || inputs.target }}.${{ inputs.environment }}
    steps:
      - name: 입력 확인
        env:
          RELEASE: ${{ inputs.release }}
          SERVICES: ${{ inputs.services }}
        run: |
          case "$ACTION" in promote|abort|undo) ;; *) echo "::error::action은 promote | abort | undo: $ACTION"; exit 1 ;; esac
          if [ "$RELEASE" = all ]; then releases="$SERVICES"; else releases="$RELEASE"; fi
          if [ -z "$releases" ]; then echo "::error::release가 all이면 services가 필요하다"; exit 1; fi
          echo "RELEASES=$releases" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
      - uses: ./.platform/.github/actions/kube-access
        with:
          target: ${{ inputs.target }}
          cluster: ${{ inputs.cluster }}
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ inputs.target == 'gcp' && vars.GCP_REGION || vars.AWS_REGION }}
          project: ${{ vars.GCP_PROJECT }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_IDENTITY }}
      - name: ${{ inputs.action }}
        run: |
          for ro in $RELEASES; do
            echo "::group::$ACTION $ro"
            case "$ACTION" in
              promote) kubectl argo rollouts promote "$ro" -n "$NAMESPACE" ;;
              abort)   kubectl argo rollouts abort "$ro" -n "$NAMESPACE" ;;
              undo)
                kubectl argo rollouts undo "$ro" -n "$NAMESPACE"
                # 되돌린 버전도 Blue-Green으로 뜬다. 빠른 롤백이 목적이라 바로 승격한다.
                for _ in $(seq 1 30); do
                  phase="$(kubectl get rollout "$ro" -n "$NAMESPACE" -o jsonpath='{.status.phase}')"
                  [ "$phase" = Paused ] && { kubectl argo rollouts promote "$ro" -n "$NAMESPACE"; break; }
                  [ "$phase" = Healthy ] && break
                  sleep 5
                done ;;
            esac
            kubectl argo rollouts get rollout "$ro" -n "$NAMESPACE"
            echo "::endgroup::"
          done
      # 감사 로그는 모든 대상이 같은 S3 버킷(Object Lock)에 남긴다. aws는 kube-access에서 이미 로그인했다.
      - if: always() && inputs.target != 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: always()
        uses: ./.platform/.github/actions/audit-log
        with:
          action: ${{ inputs.action }}
          target: ${{ env.LABEL }}
          result: ${{ job.status }}
          requested-by: ${{ inputs.requested-by }}
          bucket: ${{ vars.AUDIT_LOG_BUCKET }}
      - if: always()
        uses: ./.platform/.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL_ID }}
          flow: 수동 승격·복구 요청
          environment: ${{ inputs.environment }}
          stage: ${{ inputs.action }} 실행 결과
          next-action: ${{ job.status == 'success' && '아래 실행 결과를 확인해 주세요. PR 머지나 운영 배포 승인 알림이 아니에요.' || '요청이 실패했어요. 실행 로그를 확인해 주세요.' }}
          action: ${{ inputs.action }}
          target: ${{ env.LABEL }}
          result: ${{ job.status }}
          requested-by: ${{ inputs.requested-by }}
          # 승격한 뒤에만 되돌릴 버전이 생긴다.
          buttons: ${{ inputs.action == 'promote' && job.status == 'success' && 'undo' || '' }}
