name: checks

# 재사용 워크플로: 대상 레포의 PR · push마다 도는 컴플라이언스 검사.
# 호출하는 쪽에서 끄거나 단계를 뺄 수 있는 입력은 두지 않는다.
on:
  workflow_call:
    inputs:
      python-dirs:
        description: 'Python(uv) 프로젝트 경로 JSON 배열. 예: ["be"]'
        type: string
        default: "[]"
      node-dirs:
        description: 'Node(pnpm) 프로젝트 경로 JSON 배열. 예: ["fe"]'
        type: string
        default: "[]"
      db-init:
        description: 테스트 전에 Postgres에 적용할 SQL 파일 (없으면 건너뜀)
        type: string
        default: ""
      scan-path:
        description: 오픈소스 취약점 검사 경로
        type: string
        default: "."
      iac-path:
        description: IaC 규정 검사 경로 (없으면 건너뜀)
        type: string
        default: ""
      image-dirs:
        description: 'Dockerfile이 있는 이미지 빌드 경로 JSON 배열. 빌드 후 Trivy로 검사. 예: ["be","fe"]'
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  python:
    if: inputs.python-dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.python-dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U demo" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://demo:demo@localhost:5432/demo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - if: inputs.db-init != ''
        working-directory: .
        run: psql postgresql://demo:demo@localhost:5432/demo -f "${{ inputs.db-init }}"
      - run: uv sync --frozen
      - name: 정적분석 (ruff)
        run: uv run ruff check
      - name: 자동 테스트 (pytest)
        run: uv run pytest

  node:
    if: inputs.node-dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.node-dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 정적분석 (lint)
        run: pnpm lint
      - name: 빌드
        run: pnpm build

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 오픈소스 취약점 검사 (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac-scan:
    if: inputs.iac-path != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: IaC 규정 검사 (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.iac-path }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  # 아래 3종의 예외는 호출하는 레포 루트의 파일에 사유와 함께 적는다.
  #   이미지 취약점 · 라이선스: .trivyignore  (항목 위에 사유 주석 필수)
  #   시크릿: .gitleaks.toml 의 [allowlist] 또는 .gitleaksignore (사유 주석 필수)
  # 차단 기준은 HIGH 이상. MEDIUM 이하는 리포트 step(exit-code 0)으로만 남긴다.

  image-scan:
    if: inputs.image-dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.image-dirs) }}
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드
        run: docker build -t scan-target:${{ github.sha }} "${{ matrix.dir }}"
      - name: 이미지 취약점 리포트 (Trivy, 전체 심각도)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: "0"
          trivyignores: .trivyignore
      - name: 이미지 취약점 검사 (Trivy, HIGH 이상 차단)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scan-target:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 시크릿 유출 검사 (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 라이선스 리포트 (Trivy, 전체 심각도)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: license
          format: table
          exit-code: "0"
          trivyignores: .trivyignore
      - name: 라이선스 검사 (Trivy, HIGH 이상 차단)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
