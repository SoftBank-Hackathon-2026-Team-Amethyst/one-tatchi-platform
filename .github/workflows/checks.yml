name: checks

# 재사용 워크플로: 대상 레포의 PR · push마다 도는 컴플라이언스 검사.
# 호출하는 쪽에서 끄거나 단계를 뺄 수 있는 입력은 두지 않는다.
on:
  workflow_call:
    inputs:
      template-ref:
        description: 공통 이미지 검사 도구의 고정 플랫폼 태그
        type: string
        default: v2
      python-dirs:
        description: 'Python(uv) 프로젝트 경로 JSON 배열. 예: ["be"]'
        type: string
        default: "[]"
      node-dirs:
        description: 'Node(pnpm) 프로젝트 경로 JSON 배열. 예: ["fe"]'
        type: string
        default: "[]"
      db-init:
        description: 테스트 전에 Postgres에 적용할 SQL 파일 (없으면 건너뜀)
        type: string
        default: ""
      scan-path:
        description: 오픈소스 취약점 검사 경로
        type: string
        default: "."
      iac-path:
        description: IaC 규정 검사 경로 (없으면 건너뜀)
        type: string
        default: ""
      image-dirs:
        description: 'Dockerfile이 있는 이미지 빌드 경로 JSON 배열. 빌드 후 Trivy로 검사. 예: ["be","fe"]'
        type: string
        default: "[]"
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub 사용자명 (기존 vars.DOCKERHUB_USERNAME도 지원)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub 읽기 전용 토큰. vars.DOCKERHUB_USERNAME과 함께 있으면 빌드 전에 로그인해 pull 한도를 피한다
        required: false

permissions:
  contents: read

jobs:
  python:
    if: inputs.python-dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.python-dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U demo" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://demo:demo@localhost:5432/demo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - if: inputs.db-init != ''
        working-directory: .
        run: psql postgresql://demo:demo@localhost:5432/demo -f "${{ inputs.db-init }}"
      - run: uv sync --frozen
      - name: 정적분석 (ruff)
        run: uv run ruff check
      - name: 자동 테스트 (pytest)
        run: uv run pytest

  node:
    if: inputs.node-dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.node-dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.dir }}/package.json
        # package_json_file sets PNPM_HOME but does not add it to PATH.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 정적분석 (lint)
        run: pnpm lint
      - name: 빌드
        run: pnpm build

  vuln-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 오픈소스 취약점 검사 (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac-scan:
    if: inputs.iac-path != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: IaC 규정 검사 (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.iac-path }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  # 아래 3종의 예외는 호출하는 레포 루트의 파일에 사유와 함께 적는다.
  #   이미지 취약점 · 라이선스: .trivyignore  (항목 위에 사유 주석 필수)
  #   시크릿: .gitleaks.toml 의 [allowlist] 또는 .gitleaksignore (사유 주석 필수)
  # 차단 기준은 HIGH 이상. MEDIUM 이하는 리포트 step(exit-code 0)으로만 남긴다.

  image-scan:
    if: inputs.image-dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.image-dirs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SoftBank-Hackathon-2026-Team-Amethyst/one-tatchi-platform
          ref: ${{ inputs.template-ref }}
          path: .platform
          sparse-checkout: .github/actions/image-push
      - name: Docker Hub 인증 · QEMU 준비 (다운로드 재시도)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash .platform/.github/actions/image-push/prepare-qemu.sh
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true
      - id: build
        name: 한 번 빌드 · amd64/arm64 각각 검사
        env:
          CONTEXT: ${{ matrix.dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .platform/.github/actions/image-push/build.sh
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.skipped != 'true'
        with:
          name: checked-image-${{ github.run_id }}-${{ steps.build.outputs.key }}
          path: ${{ steps.build.outputs.bundle }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 시크릿 유출 검사 (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose

  license-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 라이선스 리포트 (Trivy, 전체 심각도)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: license
          format: table
          exit-code: "0"
          trivyignores: .trivyignore
      - name: 라이선스 검사 (Trivy, HIGH 이상 차단)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: license
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # 배포 설정(.deploy/config.yaml) 형식과 운영 관문 보호 (T6, 6.6).
  # compliance는 운영 배포의 사람 승인 여부를 정하므로(deploy.yml의 gate) 리뷰 없이 바뀌면 안 된다.
  #   - yolo 경로(yolo/** push, yolo/** → main PR)에서는 compliance와 CODEOWNERS를 바꿀 수 없다
  #   - 그 밖의 PR에서도 AI가 만든 커밋(작성자 · Co-authored-by에 AI 이름 또는 [bot])이 바꾸면 실패한다
  #   - 사람이 바꾼 PR은 통과하고, CODEOWNERS 리뷰를 받아야 머지된다
  config-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 배포 설정 형식 (.deploy/config.yaml)
        run: |
          cfg=.deploy/config.yaml
          if [ ! -f "$cfg" ]; then
            echo "::warning::$cfg가 없다. 운영 배포는 regulated(사람 승인)로 처리된다"
            exit 0
          fi
          compliance="$(yq -r '.compliance // ""' "$cfg")"
          version="$(yq -r '.template_version // ""' "$cfg")"
          fail=0
          case "$compliance" in
            regulated | none) ;;
            *) echo "::error file=$cfg::compliance는 regulated | none 중 하나여야 한다 (지금: '$compliance')"; fail=1 ;;
          esac
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=$cfg::template_version은 vX.Y.Z 형식이어야 한다 (지금: '$version')"
            fail=1
          fi
          exit "$fail"
      - name: 운영 관문 보호 (compliance · CODEOWNERS)
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT:$REF_NAME" in
            pull_request:*) base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; head="$HEAD_SHA"; branch="$HEAD_REF" ;;
            push:yolo/*) base="$(git merge-base origin/main HEAD)"; head=HEAD; branch="$REF_NAME" ;;
            *) echo "PR과 yolo/** push만 검사한다"; exit 0 ;;
          esac

          compliance_at() { git show "$1:.deploy/config.yaml" 2>/dev/null | yq -r '.compliance // ""' 2>/dev/null || true; }
          is_ai() {
            git log -1 --format='%an <%ae>%n%(trailers:key=Co-authored-by,valueonly)' "$1" |
              grep -qiE 'claude|anthropic|codex|openai|copilot|gemini|cursor|\[bot\]'
          }

          changes=()
          before="$(compliance_at "$base")"
          after="$(compliance_at "$head")"
          [ "$before" = "$after" ] || changes+=("compliance: '$before' → '$after'")
          git diff --quiet "$base" "$head" -- .github/CODEOWNERS || changes+=(".github/CODEOWNERS")
          if [ "${#changes[@]}" -eq 0 ]; then
            echo "compliance와 CODEOWNERS 변경 없음"
            exit 0
          fi
          printf '변경: %s\n' "${changes[@]}"

          if [[ "$branch" == yolo/* ]]; then
            echo "::error::yolo 경로(리뷰 없음)에서는 compliance와 CODEOWNERS를 바꿀 수 없다. janto PR(사람 리뷰)로 바꾼다"
            exit 1
          fi

          ai=()
          for c in $(git rev-list "$base..$head" -- .deploy/config.yaml .github/CODEOWNERS); do
            touched=0
            [ "$(compliance_at "$c^")" = "$(compliance_at "$c")" ] || touched=1
            git diff --quiet "$c^" "$c" -- .github/CODEOWNERS || touched=1
            if [ "$touched" = 1 ] && is_ai "$c"; then ai+=("$(git log -1 --format='%h %an: %s' "$c")"); fi
          done
          if [ "${#ai[@]}" -gt 0 ]; then
            echo "::error::AI가 만든 커밋이 compliance나 CODEOWNERS를 바꿨다. 사람이 직접 커밋한다"
            printf '  %s\n' "${ai[@]}"
            exit 1
          fi

          echo "::notice::운영 관문 변경(${changes[*]}). CODEOWNERS 리뷰를 받아야 머지된다"
          {
            echo "### 운영 관문 변경"
            printf -- '- %s\n' "${changes[@]}"
            echo "사람이 만든 변경이다. CODEOWNERS 리뷰 후 머지한다."
          } >> "$GITHUB_STEP_SUMMARY"
