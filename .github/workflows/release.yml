name: release

# 태그(vX.Y.Z)를 달면 Helm 차트를 GHCR(OCI)에 올리고, 메이저 태그(v1 등)를 최신 릴리스로 옮긴다.
# demo-app은 이 태그로 모듈(?ref=), 재사용 워크플로(@), 차트(--version)를 참조한다.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: 차트 패키징 · GHCR push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ver="${VERSION#v}"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in app service-base platform-config; do
            helm package "charts/$c" --version "$ver" --app-version "$ver" -d dist
            helm push "dist/$c-$ver.tgz" "oci://ghcr.io/$owner/charts"
          done
      - name: "메이저 태그 이동 (v1 → 최신 v1.x.y)"
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

  # Slack 봇(T26) 이미지. 대상 레포의 인프라가 같은 버전 태그로 띄운다. EKS(amd64) · 맥북 k3d(arm64) 둘 다.
  slack-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tags=ghcr.io/$owner/slack-bot:${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: slack-bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=slack-bot
          cache-to: type=gha,mode=max,scope=slack-bot

  # 대상 레포에 새 버전을 알린다. 대상 레포의 template-update 워크플로가 업데이트 PR을 연다(T22).
  # 메이저 태그(v1)를 옮긴 뒤에 보내야 대상 레포가 @v1로 새 template-update를 쓴다.
  notify:
    needs: charts
    if: vars.BOT_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: 대상 레포에 repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ github.ref_name }}
          # 공백으로 구분한 owner/repo 목록. 비우면 같은 조직의 demo-app
          CONSUMERS: ${{ vars.TEMPLATE_CONSUMERS || format('{0}/demo-app', github.repository_owner) }}
        run: |
          for repo in $CONSUMERS; do
            echo "→ $repo ($VERSION)"
            gh api "repos/$repo/dispatches" \
              -f event_type=template-released \
              -f "client_payload[version]=$VERSION"
          done
