name: release

# 태그(vX.Y.Z)를 달면 Helm 차트를 GHCR(OCI)에 올리고, 메이저 태그(v1 등)를 최신 릴리스로 옮긴다.
# demo-app은 이 태그로 모듈(?ref=), 재사용 워크플로(@), 차트(--version)를 참조한다.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  charts:
    needs: runtime-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: 차트 패키징 · GHCR push
        env:
          VERSION: ${{ github.ref_name }}
          RUNTIME_DIGEST: ${{ needs.runtime-status.outputs.digest }}
        run: |
          ver="${VERSION#v}"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          sed -i "s|digest: \"\"|digest: \"$RUNTIME_DIGEST\"|" charts/runtime-status/values.yaml
          for c in app service-base platform-config observability grafana-wif runtime-status; do
            helm package "charts/$c" --version "$ver" --app-version "$ver" -d dist
            helm push "dist/$c-$ver.tgz" "oci://ghcr.io/$owner/charts"
          done
      - name: "메이저 태그 이동 (v1 → 최신 v1.x.y)"
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"

  runtime-status:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tags=ghcr.io/$owner/runtime-status:${VERSION#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: runtime-status
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=runtime-status
          cache-to: type=gha,mode=max,scope=runtime-status

  # Slack 봇(T26) 이미지. 대상 레포의 인프라가 같은 버전 태그로 띄운다. EKS(amd64) · 맥북 k3d(arm64) 둘 다.
  slack-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub 로그인 (pull 한도 회피, 설정이 없으면 건너뜀)
        if: vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tags=ghcr.io/$owner/slack-bot:${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: slack-bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=slack-bot
          cache-to: type=gha,mode=max,scope=slack-bot

  nginxlog-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub 로그인 (pull 한도 회피, 설정이 없으면 건너뜀)
        if: vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tags=ghcr.io/$owner/nginxlog-exporter:${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/nginxlog-exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=nginxlog-exporter
          cache-to: type=gha,mode=max,scope=nginxlog-exporter

  # 대상 레포에 새 버전을 알린다. 대상 레포의 template-update 워크플로가 업데이트 PR을 연다(T22).
  # 메이저 태그(v2)를 옮긴 뒤에 보내야 대상 레포가 @v2로 새 template-update를 쓴다.
  notify:
    needs: [charts, nginxlog-exporter]
    # 대상 레포가 쓰는 현재 메이저(v2)의 릴리스만 알린다. 메이저를 넘는 업그레이드(v1 → v2 등)는
    # onprem 자격증명 · state 이전이 필요해 자동 PR로 제안하지 않는다(T27). 메이저를 올릴 때 이 조건도 함께 바꾼다.
    # 같은 메이저 안에서는 bump-template-version.sh가 infra_versions 고정값을 유지한다.
    if: vars.BOT_CLIENT_ID != '' && startsWith(github.ref_name, 'v2.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: 대상 레포에 repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ github.ref_name }}
          # 공백으로 구분한 owner/repo 목록. 비우면 같은 조직의 demo-app
          CONSUMERS: ${{ vars.TEMPLATE_CONSUMERS || format('{0}/demo-app', github.repository_owner) }}
        run: |
          for repo in $CONSUMERS; do
            echo "→ $repo ($VERSION)"
            gh api "repos/$repo/dispatches" \
              -f event_type=template-released \
              -f "client_payload[version]=$VERSION"
          done
