name: sync-tasks

# docs/tasks.md가 main에 들어오면 이슈(제목 · 본문 · 라벨)와 프로젝트 보드 상태를 맞춘다.
# 사람은 tasks.md만 고친다. 보드와 이슈 본문은 이 워크플로가 따라간다.
on:
  push:
    branches: [main]
    paths: [docs/tasks.md, scripts/sync_tasks.py]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-tasks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 이슈 · 보드 맞추기
        env:
          # 조직 프로젝트는 기본 토큰으로 못 고친다. PROJECT_TOKEN(이슈 + 프로젝트 쓰기)이 없으면 이슈만 맞춘다.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
          HAS_PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN != '' }}
        run: |
          if [ "$HAS_PROJECT_TOKEN" = "true" ]; then
            python3 scripts/sync_tasks.py | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PROJECT_TOKEN 시크릿이 없어 보드는 건너뛴다"
            python3 scripts/sync_tasks.py --no-board | tee -a "$GITHUB_STEP_SUMMARY"
          fi
