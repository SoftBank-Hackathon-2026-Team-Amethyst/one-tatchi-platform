name: image-push
description: checks의 OCI 산출물만 대상 레지스트리에 발행한다. hosted runner에서 사용한다.
inputs:
  target:
    description: aws | gcp | onprem
    required: true
  services:
    description: name/path를 가진 서비스 JSON 배열
    required: true
  bundles:
    description: 같은 run에서 다운로드한 checked-image artifact 디렉터리
    required: true
  registry:
    description: AWS ECR registry 주소
    default: ""
  project:
    description: GCP project ID
    default: ""
  region:
    description: GCP region
    default: ""
outputs:
  images:
    description: 서비스별 repository/digest/source_sha JSON
    value: ${{ steps.publish.outputs.images }}
runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SERVICES: ${{ inputs.services }}
        BUNDLES: ${{ inputs.bundles }}
        ECR_REGISTRY: ${{ inputs.registry }}
        GCP_PROJECT: ${{ inputs.project }}
        GCP_REGION: ${{ inputs.region }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/publish.py"
