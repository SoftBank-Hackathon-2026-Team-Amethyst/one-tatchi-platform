name: promote-judge
description: >-
  Paused 상태의 green(서비스 여러 개)에 smoke 요청을 동시에 보내 지표를 모으고, 서비스마다 규칙 판정과 Claude 판단을 한 뒤
  묶어서 promote 또는 abort를 정한다(하나라도 abort면 전체 abort, ADR 0005).
  판단에 실패하면 abort다. mode가 auto면 바로 실행하고(abort면 step 실패), manual이면 실행하지 않는다.
  Slack 알림 · 감사 로그는 호출하는 쪽(deploy.yml)이 출력 decision · reason · executed로 남긴다.
  deploy.yml의 배포 job 안에서 kube-access 다음에 호출한다 (ADR 0002).
inputs:
  releases:
    description: 판단할 서비스(Rollout) 이름들, 공백 구분. green은 Service <release>-preview로 접근한다
    required: true
  namespace:
    description: 서비스 네임스페이스 (test | prod)
    required: true
  target:
    description: "배포 대상: aws | gcp | onprem (Job Summary 표기용)"
    required: true
  environment:
    description: test | prod (Job Summary 표기용)
    required: true
  mode:
    description: "auto: 판단대로 promote · abort 실행 (yolo) | manual: 실행하지 않고 근거와 버튼만 남김 (janto)"
    default: manual
  smoke-file:
    description: smoke 요청 목록 JSON (대상 레포 기준 경로). 없으면 GET /health → 200만 확인한다
    default: .deploy/smoke.json
  window-seconds:
    description: 관찰 창(초). 이 시간 동안 smoke 요청을 반복한다
    default: "30"
  request-timeout-seconds:
    description: 요청 하나의 제한 시간(초). 넘으면 실패로 센다
    default: "5"
  max-error-rate:
    description: 허용 에러율(%). 넘으면 규칙 판정 fail
    default: "0"
  max-p95-ms:
    description: 허용 p95 응답 시간(ms). 넘으면 규칙 판정 fail. 비우면 검사하지 않는다
    default: "2000"
  max-restarts:
    description: 허용하는 green 파드 재시작 수(파드 생성 이후 합계). 넘으면 규칙 판정 fail
    default: "0"
  model:
    description: 판단에 쓸 Claude 모델
    default: claude-sonnet-5-5
  api-timeout-seconds:
    description: Claude API 호출 제한 시간(초). 넘으면 재시도 없이 abort
    default: "60"
  anthropic-api-key:
    description: Claude API 키 (secrets.ANTHROPIC_API_KEY). 비어 있으면 AI 판단 없이 abort
    default: ""
  promote-wait-seconds:
    description: auto에서 promote한 뒤 Rollout이 Healthy가 되기를 기다리는 시간(초). 넘으면 실패
    default: "60"
outputs:
  decision:
    description: 묶음 결정 promote | abort
    value: ${{ steps.judge.outputs.decision }}
  reason:
    description: 판단 근거 한두 문장
    value: ${{ steps.judge.outputs.reason }}
  report:
    description: 묶음 결정 JSON 파일 경로. 서비스별 지표 · 판단은 같은 폴더의 <release>/
    value: ${{ steps.judge.outputs.report }}
  executed:
    description: "auto에서 실제로 성공한 조작 (promote | abort). manual이거나 명령이 실패하면 빈 값"
    value: ${{ steps.act.outputs.executed }}
runs:
  using: composite
  steps:
    - name: smoke 요청 (서비스별 green, 동시에)
      # 실패해도 다음 단계로 간다. 결과가 없거나 모자라면 judge가 abort로 처리한다.
      continue-on-error: true
      shell: bash
      env:
        WORK_ROOT: ${{ runner.temp }}/promote-judge
        RELEASES: ${{ inputs.releases }}
        NAMESPACE: ${{ inputs.namespace }}
        SMOKE_FILE: ${{ inputs.smoke-file }}
        WINDOW_SECONDS: ${{ inputs.window-seconds }}
        REQUEST_TIMEOUT_SECONDS: ${{ inputs.request-timeout-seconds }}
      run: bash "$GITHUB_ACTION_PATH/group.sh" smoke

    - name: 지표 계산 · 규칙 판정
      continue-on-error: true
      shell: bash
      env:
        WORK_ROOT: ${{ runner.temp }}/promote-judge
        RELEASES: ${{ inputs.releases }}
        NAMESPACE: ${{ inputs.namespace }}
        MAX_ERROR_RATE: ${{ inputs.max-error-rate }}
        MAX_P95_MS: ${{ inputs.max-p95-ms }}
        MAX_RESTARTS: ${{ inputs.max-restarts }}
      run: bash "$GITHUB_ACTION_PATH/group.sh" metrics

    - id: judge
      name: AI 판단 (서비스별 → 묶음)
      shell: bash
      env:
        WORK_ROOT: ${{ runner.temp }}/promote-judge
        RELEASES: ${{ inputs.releases }}
        MODEL: ${{ inputs.model }}
        API_TIMEOUT_SECONDS: ${{ inputs.api-timeout-seconds }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: bash "$GITHUB_ACTION_PATH/group.sh" judge

    - id: act
      name: 판단 실행(auto) · 기록
      shell: bash
      env:
        WORK_ROOT: ${{ runner.temp }}/promote-judge
        RELEASES: ${{ inputs.releases }}
        NAMESPACE: ${{ inputs.namespace }}
        TARGET: ${{ inputs.target }}
        ENVIRONMENT: ${{ inputs.environment }}
        MODE: ${{ inputs.mode }}
        PROMOTE_WAIT_SECONDS: ${{ inputs.promote-wait-seconds }}
      run: bash "$GITHUB_ACTION_PATH/group.sh" act
