name: kube-access
description: 배포 대상 클러스터의 kubeconfig와 helm · kubectl argo rollouts 플러그인을 준비한다. 벤더별 차이는 여기에만 둔다.
inputs:
  target:
    description: "배포 대상: aws | gcp | onprem"
    default: aws
  cluster:
    description: "aws: EKS 클러스터 이름, onprem: runner의 kube context 이름 (예: k3d-onetouch)"
    required: true
  role-arn:
    description: aws만. Deploy 역할 ARN
    default: ""
  region:
    description: AWS 또는 GCP 리전
    default: ""
  project:
    description: GCP 프로젝트 ID
    default: ""
  workload-identity-provider:
    description: GCP deploy WIF provider
    default: ""
  service-account:
    description: GCP deploy 서비스 계정 이메일
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.target == 'aws'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - uses: azure/setup-helm@v5
      with:
        # deploy.yml이 Helm 4 플래그(--server-side)를 쓴다. 메이저가 바뀌면 같이 확인한다.
        version: v4.3.0
    - if: inputs.target == 'gcp'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        project_id: ${{ inputs.project }}
    - if: inputs.target == 'gcp'
      uses: google-github-actions/setup-gcloud@v3
      with:
        install_components: gke-gcloud-auth-plugin
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CLUSTER: ${{ inputs.cluster }}
        REGION: ${{ inputs.region }}
        GCP_PROJECT: ${{ inputs.project }}
      run: |
        # kubeconfig · 레지스트리 설정은 job 전용 파일에 둔다. self-hosted runner의 기본 설정을 건드리지 않는다.
        export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
        echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
        # Helm(oras)은 설정에 auths 항목이 없으면 macOS 키체인 도우미를 불러 launchd runner에서 실패한다.
        # 빈 ghcr.io 항목을 두면 도우미 없이 공개 차트를 익명으로 받는다. image-push가 같은 Docker 설정에 인증을 덮어쓴다.
        mkdir -p "$RUNNER_TEMP/docker" "$RUNNER_TEMP/helm"
        echo '{"auths":{"ghcr.io":{}}}' > "$RUNNER_TEMP/docker/config.json"
        echo '{"auths":{"ghcr.io":{}}}' > "$RUNNER_TEMP/helm/registry.json"
        echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
        echo "HELM_REGISTRY_CONFIG=$RUNNER_TEMP/helm/registry.json" >> "$GITHUB_ENV"
        case "$TARGET" in
          aws)
            aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION" ;;
          gcp)
            gcloud container clusters get-credentials "$CLUSTER" --region "$REGION" --project "$GCP_PROJECT" ;;
          onprem)
            # 클러스터는 runner와 같은 맥북에 있다. runner 계정의 kube context를 복사해 쓴다.
            KUBECONFIG="$HOME/.kube/config" kubectl config view --raw --minify --context "$CLUSTER" > "$KUBECONFIG" ;;
          *)
            echo "::error::지원하지 않는 배포 대상: $TARGET (aws | gcp | onprem)"; exit 1 ;;
        esac
        kubectl cluster-info >/dev/null

        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"; case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSLo "$RUNNER_TEMP/bin/kubectl-argo-rollouts" \
          "https://github.com/argoproj/argo-rollouts/releases/download/v1.10.0/kubectl-argo-rollouts-$os-$arch"
        chmod +x "$RUNNER_TEMP/bin/kubectl-argo-rollouts"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
