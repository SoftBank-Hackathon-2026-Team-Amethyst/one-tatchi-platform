name: slack-notify
description: 배포 파이프라인 작업 결과를 Slack 채널에 올립니다. 토큰이나 채널이 없으면 건너뛰고, 실패해도 job을 실패시키지 않습니다.
inputs:
  token:
    description: Slack 봇 토큰 (secrets.SLACK_BOT_TOKEN)
    required: false
  channel:
    description: 채널 ID (vars.SLACK_CHANNEL_ID)
    required: false
  action:
    description: deploy | promote | abort | undo | infra-apply | destroy
    required: true
  target:
    description: 대상 (서비스 이름, 스택 이름 등)
    required: true
  version:
    description: 반영한 버전 (커밋 SHA 등)
    default: ${{ github.sha }}
  result:
    description: success | failure | cancelled | waiting
    required: true
  requested-by:
    description: 워크플로를 대신 실행시킨 주체 (예. Slack 사용자)
    required: false
  details:
    description: 본문 아래에 덧붙일 내용 (Slack mrkdwn)
    required: false
  buttons:
    description: >-
      붙일 조작 버튼. promote, abort, undo, review, merge, approve, reject 중에서 공백으로 구분합니다.
      promote · abort · undo는 slack-bot이 받아 대상 레포의 rollout 워크플로를 실행하고, review는 누른 사람의
      GitHub 계정으로 PR에 Approve 리뷰를 남기고, merge는 PR을 머지하고,
      approve · reject는 승인 대기 중인 운영 배포를 승인 · 거절합니다.
    required: false
  service:
    description: "promote · abort · undo 버튼이 조작할 대상 (<서비스|all>@<대상>.<환경>). 비우면 target을 쓴다"
    default: ""
  pr:
    description: review · merge 버튼이 다룰 PR 번호 (대상 레포)
    default: ""
  approval:
    description: "approve · reject 버튼이 처리할 승인 대기 (<워크플로 실행 ID>@<GitHub environment>)"
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        CHANNEL: ${{ inputs.channel }}
        ACTION: ${{ inputs.action }}
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        RESULT: ${{ inputs.result }}
        REQUESTED_BY: ${{ inputs.requested-by }}
        DETAILS: ${{ inputs.details }}
        BUTTONS: ${{ inputs.buttons }}
        SERVICE: ${{ inputs.service || inputs.target }}
        PR: ${{ inputs.pr }}
        APPROVAL: ${{ inputs.approval }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: |
        if [ -z "$TOKEN" ] || [ -z "$CHANNEL" ]; then
          echo "Slack 설정(SLACK_BOT_TOKEN, SLACK_CHANNEL_ID)이 없어 알림을 건너뜁니다"
          exit 0
        fi
        case "$RESULT" in
          success)   icon=":white_check_mark:"; greeting="야하! 작업 성공!" ;;
          failure)   icon=":x:"; greeting="하아…? 작업 실패. 실행 로그를 확인해 주세요." ;;
          waiting)   icon=":hourglass_flowing_sand:"; greeting="우라! 대기 중." ;;
          cancelled) icon=":warning:"; greeting="후웅… 작업이 취소됐습니다." ;;
          *)         icon=":warning:"; greeting="후웅… 실행 상태를 확인해 주세요." ;;
        esac
        # 짧은 감탄사는 우사기에서 착안한 표현. 성공 알림을 트래픽 승격 완료로 해석하지 않습니다.
        if [ "$RESULT" = success ]; then
          case "$ACTION" in
            "PR 준비") greeting="야하! PR 검사 통과!" ;;
            deploy) greeting="야하! 배포 완료! 승격 여부는 아래 결과를 확인해 주세요." ;;
            promote) greeting="우라라! 승격 완료!" ;;
            abort) greeting="후웅! 배포 중단 처리 완료." ;;
            undo) greeting="우라! 되돌리기 완료." ;;
            infra-apply) greeting="야하! 인프라 반영 완료!" ;;
            destroy) greeting="후웅! 리소스 삭제 완료." ;;
          esac
        elif [ "$RESULT" = waiting ] && [ "$ACTION" = "운영 승인 대기" ]; then
          greeting="우라! 운영 승인 대기 중. 대상과 버전을 확인해 주세요."
        fi
        text="$icon $greeting
        *$ACTION* \`$TARGET\` @ \`${VERSION::7}\` ($RESULT)"
        meta="${REQUESTED_BY:-$GITHUB_ACTOR} | <$RUN_URL|워크플로 실행 보기>"
        # 버튼의 action_id와 value는 slack-bot/app/main.py와 맞춘 약속입니다 (slack-bot/README.md "버튼 약속").
        #   rollout_<promote|abort|undo>: value = <서비스|all>@<대상>.<환경>
        #   pr_approve, pr_merge:         value = PR 번호
        #   deploy_<approve|reject>:      value = <워크플로 실행 ID>@<GitHub environment>
        payload="$(jq -n \
          --arg channel "$CHANNEL" --arg text "$text" --arg details "$DETAILS" \
          --arg meta "$meta" --arg buttons "$BUTTONS" --arg service "$SERVICE" --arg pr "$PR" --arg approval "$APPROVAL" '
          def title: {promote: "승격", abort: "취소", undo: "되돌리기", review: "리뷰 승인", merge: "머지", approve: "승인", reject: "거절"}[.];
          def plain: {type: "plain_text", text: .};
          def button:
            (if . == "merge" then {id: "pr_merge", value: $pr, subject: "PR #\($pr)"}
             elif . == "review" then {id: "pr_approve", value: $pr, subject: "PR #\($pr)"}
             elif . == "approve" or . == "reject" then {id: ("deploy_" + .), value: $approval, subject: "운영 배포"}
             else {id: ("rollout_" + .), value: $service, subject: $service} end) as $b
            | {type: "button", action_id: $b.id, value: $b.value, text: (title | plain),
               confirm: {title: ("확인" | plain), text: ("\($b.subject)에 \(title) 요청을 보낼까요?" | plain),
                         confirm: ("실행" | plain), deny: ("닫기" | plain)}}
              + (if . == "promote" or . == "merge" or . == "approve" or . == "review" then {style: "primary"}
                 elif . == "undo" or . == "reject" then {style: "danger"} else {} end);
          ($buttons | split(" ") | map(select(. != ""))) as $actions
          | {channel: $channel, text: $text, blocks: (
              [{type: "section", text: {type: "mrkdwn", text: $text}}]
              + (if $details != "" then [{type: "section", text: {type: "mrkdwn", text: $details}}] else [] end)
              + [{type: "context", elements: [{type: "mrkdwn", text: $meta}]}]
              + (if ($actions | length) > 0 then [{type: "actions", elements: ($actions | map(button))}] else [] end)
            )}')"
        response="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "$payload" || true)"
        if [ "$(jq -r '.ok' <<<"$response" 2>/dev/null)" != true ]; then
          echo "::warning::Slack 알림 실패: $(jq -r '.error // "unknown"' <<<"$response" 2>/dev/null || echo "$response")"
        fi
